<!doctype html>
<html><head><meta charset="utf-8"><title>99 Days: story</title>
<style>
:root{--bg:#0e1013;--bg2:#13161b;--bg3:#1a1e25;--line:#252a33;--fg:#c9d1d9;--dim:#6b7380;--dim2:#3d4450;--acc:#e8c84a;--say:#7ad0c8;--narr:#9aa4b8;--you:#d8dce8;--label:#e8a86a;--pool:#a8c8a0;--bad:#e86a6a;--ok:#8ae88a;--font:"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}

button{background:var(--bg3);border:1px solid var(--line);color:var(--fg);font:inherit;padding:5px 10px;border-radius:3px;cursor:pointer;white-space:nowrap}button:hover{border-color:var(--acc);color:var(--acc)}button.primary{border-color:var(--acc);color:var(--acc)}button:disabled{opacity:.4;cursor:default}

.g{color:var(--dim2);text-align:right;cursor:pointer;user-select:none;padding-top:3px}.g:hover{color:var(--dim)}
.tag{padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag.say{color:var(--say)}.tag.narr{color:var(--narr);font-style:italic}.tag.you{color:var(--you)}.tag.label{color:var(--label)}.tag.pool{color:var(--pool)}
.tree{color:var(--dim2)}

textarea:hover{border-color:var(--line)}textarea:focus{outline:none;border-color:var(--acc);background:var(--bg2)}

.x{color:var(--dim2);cursor:pointer;text-align:center;padding-top:3px}.x:hover{color:var(--bad)}
.meta{color:var(--dim2);font-size:11px;padding-left:6px}.meta b{color:var(--dim);font-weight:normal}
.src{background:var(--bg3);border:1px solid var(--line);margin:4px 0 6px 66px;color:var(--dim);font-size:11.5px;border-radius:3px}.src.dirty{border-color:var(--acc)}.src.err{border-color:var(--bad)}
.srchead{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;border-bottom:1px solid var(--line);color:var(--dim2)}.srcbtns{display:flex;gap:10px;align-items:center}.srchead .hint{color:var(--dim2)}.srchead button{padding:2px 8px;font-size:11px}
.srcbody{display:grid;grid-template-columns:44px 1fr}.nums{padding:6px 0;text-align:right;color:var(--dim2);user-select:none;overflow:hidden;line-height:1.5}.nums span{display:block;padding-right:8px}.nums .hl{color:var(--acc)}
.srcta{width:100%;background:transparent;border:none;color:var(--fg);font:inherit;font-size:11.5px;line-height:1.5;padding:6px 10px;resize:none;white-space:pre;overflow-x:auto;overflow-y:hidden;border-left:1px solid var(--line)}.srcta:focus{outline:none;background:var(--bg2)}
.add{display:grid;grid-template-columns:1fr 240px 56px 56px 80px;gap:8px;margin:10px 0 0 66px;align-items:center}.add input{background:var(--bg);border:1px solid var(--line);color:var(--fg);font:inherit;padding:4px 6px;border-radius:2px}.add input:focus{outline:none;border-color:var(--acc)}
/* music */
.mtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.mtab{padding:4px 10px;border:1px solid var(--line);border-radius:3px;cursor:pointer;color:var(--fg)}.mtab small{color:var(--dim2);margin-left:6px}.mtab.on{border-color:var(--acc);color:var(--acc)}.mtab.newsong{color:var(--dim)}.mtab:hover{border-color:var(--acc)}
.mhead,.mtransport{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:8px 0;padding:8px 10px;background:var(--bg2);border:1px solid var(--line);border-radius:3px}.mhead label,.mtransport label{color:var(--dim);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mhead input,.mhead select,.mtransport select,.mlyrics input,.mgrid2 input,.mgrid2 textarea,.mgrid2 select,.mmix input[type=number],.mmix select{background:var(--bg);border:1px solid var(--line);color:var(--fg);font:inherit;padding:3px 6px;border-radius:2px}.mhead input:focus,.mlyrics input:focus,.mgrid2 textarea:focus,.mgrid2 input:focus{outline:none;border-color:var(--acc)}
.mpos{color:var(--acc);white-space:nowrap}

.mtoggle{color:var(--dim);cursor:pointer;padding:1px 6px;border:1px solid transparent;border-radius:2px}.mtoggle.on{color:var(--acc);border-color:var(--line)}.mtoggle:hover{color:var(--acc)}
.mlyrics .mly{display:grid;grid-template-columns:64px 1fr 20px;gap:8px;align-items:center;margin:3px 0}.mlyrics .x{text-align:center}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}.mgrid2 label{color:var(--dim);display:flex;flex-direction:column;gap:3px}.mgrid2 label.wide{grid-column:1/-1}.mgrid2 textarea{resize:vertical;overflow:auto;color:var(--narr)}
.mmix{border-collapse:collapse;width:100%}.mmix th{text-align:left;color:var(--dim2);font-weight:normal;font-size:11px;padding:2px 8px}.mmix td{padding:3px 8px;border-top:1px solid var(--line)}.mmix .pn{color:var(--say)}.mmix input[type=range]{width:90px;vertical-align:middle}.mmix .vv{color:var(--dim);margin-left:6px;font-size:11px}.mmix input[type=number]{width:70px}
.croots{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.croot{padding:2px 7px;border:1px solid var(--line);border-radius:2px;cursor:pointer;color:var(--fg)}.croot.on{border-color:var(--acc);color:var(--acc)}.croot:hover{border-color:var(--acc)}
/* timeline */
.tl{position:relative;margin-top:8px}.ruler{display:grid;grid-template-columns:200px 1fr;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line);padding-bottom:4px}
.days{position:relative;height:34px}.days .d{position:absolute;top:18px;font-size:10px;color:var(--dim2);transform:translateX(-50%)}.days .d.wk{color:var(--dim)}.days .m{position:absolute;top:0;font-size:11px;color:var(--acc)}
.lane{display:grid;grid-template-columns:200px 1fr;min-height:22px;border-bottom:1px solid #161a20}.lane:hover{background:#111419}.lane .n{padding:3px 8px 0 0;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lane .n b{color:var(--fg);font-weight:normal}
.track{position:relative;height:22px}.wkend{position:absolute;top:0;bottom:0;background:rgba(255,255,255,0.025)}
.bar{position:absolute;top:6px;height:10px;border-radius:2px;background:rgba(122,208,200,0.18);border-left:2px solid var(--say);cursor:pointer}.bar:hover{background:rgba(232,200,74,0.25);border-left-color:var(--acc)}
.bar.lt{border-left:none;border-right:2px solid var(--label);background:rgba(232,168,106,0.15)}
.mk{position:absolute;top:4px;width:8px;height:14px;transform:translateX(-4px);background:var(--acc);border-radius:2px;cursor:pointer;opacity:.85}.mk.hol{background:var(--bad)}.mk:hover{opacity:1;outline:1px solid #fff}
.lbl{position:absolute;top:4px;font-size:10.5px;color:var(--dim);white-space:nowrap;pointer-events:none;padding-left:4px}
.today{position:absolute;top:0;bottom:0;width:1px;background:var(--dim2)}
#pop{position:fixed;background:var(--bg2);border:1px solid var(--acc);padding:10px 12px;z-index:9;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;max-width:420px}#pop .c{color:var(--dim);margin-bottom:8px;white-space:pre-wrap}#pop input{width:60px;background:var(--bg);border:1px solid var(--line);color:var(--fg);font:inherit;padding:3px 6px}
.money{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}.money .cur{color:var(--dim)}.mval{width:78px;background:var(--bg);border:1px solid var(--line);color:var(--acc);font:inherit;padding:3px 6px;border-radius:2px;text-align:right}.mval:focus{outline:none;border-color:var(--acc);background:var(--bg2)}
.arc{border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:3px;background:var(--bg2);margin:0 0 16px;padding:8px 12px}
.arctop{display:flex;gap:12px;align-items:baseline}.arcttl{color:var(--acc);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}.arcsum{flex:1;color:var(--fg);line-height:1.55}.arcsum i{color:var(--dim2)}
.arcbtns{white-space:nowrap;color:var(--dim);font-size:11px}.arcbtns span{cursor:pointer;margin-left:10px}.arcbtns span:hover{color:var(--acc)}
.beats{display:none;margin:8px 0 2px;padding-left:22px;color:var(--narr);line-height:1.5}.beats li{padding:1px 0 1px 4px}.beats li::marker{color:var(--dim2)}.arc.open .beats{display:block}
.arcform{display:none;margin-top:8px}.arc.editing .arcform{display:block}.arc.editing .arctop .arcsum,.arc.editing .beats{display:none}.arcform textarea{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);font:inherit;padding:6px 8px;border-radius:2px;margin-bottom:6px;overflow:hidden;line-height:1.5}.arcform textarea.arcb{color:var(--narr)}.arcform textarea:focus{outline:none;border-color:var(--acc)}.arcform .btns{display:flex;gap:8px}
.mlabel{padding-top:4px}.formula{display:block;color:var(--dim);font-size:11px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:350px}.mrow{padding:5px 0;border-bottom:1px solid #14171c}.mrow .meta .g{display:inline;padding:0;color:var(--dim2)}.mrow .meta .g:hover{color:var(--acc)}
.legend{color:var(--dim);margin:6px 0 12px}.legend span{margin-right:14px}
kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--dim)}
.git{color:var(--dim);white-space:nowrap;cursor:pointer;padding:3px 8px;border:1px solid transparent;border-radius:3px}.git:hover{border-color:var(--line)}.git.behind{color:var(--acc)}.git.ahead{color:var(--say)}.git.bad{color:var(--bad)}
#gitpop{position:fixed;top:46px;right:14px;width:520px;background:var(--bg2);border:1px solid var(--acc);padding:12px 14px;z-index:9;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none}
#gitpop h3{margin:0 0 8px;font-size:12.5px;color:var(--acc);font-weight:600}#gitpop .info{color:var(--dim);margin-bottom:8px;white-space:pre-wrap}#gitpop .info b{color:var(--fg);font-weight:normal}
#gitpop input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);font:inherit;padding:5px 8px;border-radius:2px;margin-bottom:8px}#gitpop input[type=text]:focus{outline:none;border-color:var(--acc)}
#gitpop .log{color:var(--dim);white-space:pre-wrap;margin-top:8px;max-height:60vh;overflow:auto}#gitpop .log.ok{color:var(--ok)}#gitpop .log.bad{color:var(--bad)}#gitpop .btns{display:flex;gap:8px;align-items:center}#gitpop .btns .r{margin-left:auto;color:var(--dim2);cursor:pointer}
.hunk{border:1px solid var(--line);border-radius:3px;padding:6px 8px;margin:6px 0}.hunk .f{color:var(--dim2);font-size:11px;margin-bottom:4px}.hunk label{display:grid;grid-template-columns:16px 52px 1fr;gap:4px;align-items:start;cursor:pointer;padding:3px 0;color:var(--fg)}.hunk label .t{white-space:pre-wrap}.hunk input{margin:3px 0 0;accent-color:var(--acc)}.hunk label .k{color:var(--dim)}.hunk label b{color:var(--acc);font-weight:normal;background:rgba(232,200,74,.1);border-radius:2px}.hunk label .ctx{color:var(--dim)}
</style></head><body>
<div id="top"><span class="t">99 DAYS</span><span class="path">src/*.js</span><input id="q" placeholder="search lines  (name, word, file)"><button id="saveAll" disabled>save changes</button><button id="build" class="primary">build index.html</button><button id="sync" title="commit, pull, rebuild, push">sync</button><span id="git" class="git" title="git"></span><span id="status">loading</span></div>
<div id="side"></div>
<div id="main"></div>
<div id="pop"></div>
<div id="gitpop"></div>
<script src="/src/09l_synth.js"></script>
<script>
const $ = s => document.querySelector(s); let DATA = null; Object.defineProperty(window, "DATA", { get: () => DATA }); let view = { kind: 'char', id: 'amos' }; const dirty = new Map();
const KIND = { say: 'say', sayPick: 'say', sayExpr: 'say', narr: 'narr', narrPick: 'narr', narrExpr: 'narr', you: 'you', label: 'label', pool: 'pool', poolInline: 'pool' };
const status = (t, c) => { const s = $('#status'); s.textContent = t; s.className = c || ''; };
async function load() { status('loading'); DATA = await (await fetch('/api/data')).json(); dirty.clear(); $('#saveAll').disabled = true; renderSide(); render(); status(`${DATA.items.length} lines, ${DATA.gates.length} day gates`); }
function charsList() { const counts = {}; for (const it of DATA.items) counts[it.who] = (counts[it.who] || 0) + 1; const order = ['amos', 'mei', 'walter', 'nadia', 'nora', 'sol', 'theo', 'busker', 'emmett', 'signe', 'birdie', 'morrow', 'jo', 'doctor', 'granny', 'kid', 'worker', 'owner', 'pryor', 'lena', 'marsh', 'mrsLin', 'dutch', 'lou', 'widow', 'samDad', 'desk', 'voice', 'caller', 'towerman', 'dog', 'system']; const ids = [...new Set(order.concat(Object.keys(counts)))].filter(k => counts[k]); return ids.map(id => ({ id, name: DATA.names[id] || id, n: counts[id] })); }
function renderSide() {
  const s = $('#side'); let h = '<h4>Views</h4>'; h += `<a data-v="timeline" class="${view.kind === 'timeline' ? 'on' : ''}">Timeline<span class="n">1-99</span></a>`; h += `<a data-v="gates" class="${view.kind === 'gates' ? 'on' : ''}">Day gates<span class="n">${DATA.gates.length}</span></a>`; h += `<a data-v="money" class="${view.kind === 'money' ? 'on' : ''}">Money<span class="n">${DATA.money.length}</span></a>`; h += `<a data-v="music" class="${view.kind === 'music' ? 'on' : ''}">Music<span class="n">${DATA.songs.list.length}</span></a>`;
  h += '<h4>Characters</h4>'; for (const c of charsList()) h += `<a data-c="${c.id}" class="${view.kind === 'char' && view.id === c.id ? 'on' : ''}">${c.name}<span class="n">${c.n}</span></a>`;
  s.innerHTML = h; s.querySelectorAll('a').forEach(a => a.onclick = () => { view = a.dataset.v ? { kind: a.dataset.v } : { kind: 'char', id: a.dataset.c }; $('#q').value = ''; renderSide(); render(); $('#main').scrollTop = 0; });
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function render() { const q = $('#q').value.trim().toLowerCase(); if (q) return renderSearch(q); if (view.kind === 'timeline') return renderTimeline(); if (view.kind === 'gates') return renderGates(); if (view.kind === 'money') return renderMoney(); if (view.kind === 'music') return renderMusic(); renderChar(view.id); }
function rowHtml(it) {
  const k = KIND[it.kind] || it.kind; const tree = it.depth ? '<span class="tree">' + '│ '.repeat(it.depth - 1) + (k === 'label' ? '├▸ ' : '│ ') + '</span>' : (k === 'label' ? '<span class="tree">▸ </span>' : '');
  const tag = k === 'say' ? (DATA.names[it.who] || it.who) : k === 'narr' ? '(narration)' : k === 'you' ? 'YOU' : k === 'label' ? 'CHOICE' : 'pool';
  const meta = it.pool ? `<div class="meta"><b>days ${it.pool.d0}-${it.pool.d1}</b>${it.pool.need ? ' · when ' + esc(it.pool.need) : ''}</div>` : '';
  const x = it.kind === 'pool' ? `<div class="x" title="remove this pool line" data-x="${it.id}">×</div>` : '<div></div>';
  return `<div class="row ${k}" data-id="${it.id}"><div class="g" title="${it.file}:${it.line}  (click for source)" data-src="${it.file}|${it.line}">${it.line}</div><div class="tag ${k}">${tree}${tag}</div><div><textarea rows="1" data-id="${it.id}">${esc(it.text)}</textarea>${meta}</div>${x}</div>`;
}
// the storyline card at the top of a character: summary + beats, editable, saved to tools/arcs.json
function arcHtml(id) {
  const a = (DATA.arcs || {})[id] || { arc: '', beats: [] }; const has = a.arc || (a.beats && a.beats.length);
  let open = false; try { open = localStorage.getItem('arc_open_' + id) !== '0'; } catch (e) { }
  return `<div class="arc ${open ? 'open' : ''}" data-arc="${id}"><div class="arctop"><span class="arcttl">storyline</span><span class="arcsum">${has ? esc(a.arc) : '<i>no summary yet</i>'}</span><span class="arcbtns"><span class="arcedit" title="edit the summary and beats">edit</span><span class="arctog">${open ? 'hide beats' : (a.beats || []).length + ' beats'}</span></span></div>` +
    `<ol class="beats">${(a.beats || []).map(b => `<li>${esc(b)}</li>`).join('')}</ol>` +
    `<div class="arcform"><textarea class="arca" placeholder="one or two sentences: who they are, what the arc is about, how it ends" spellcheck="true">${esc(a.arc || '')}</textarea><textarea class="arcb" placeholder="one beat per line, in story order" spellcheck="true">${esc((a.beats || []).join('\n'))}</textarea><div class="btns"><button class="arcsave primary">save storyline</button><button class="arccancel">cancel</button></div></div></div>`;
}
function wireArc() {
  const el = document.querySelector('.arc'); if (!el) return; const id = el.dataset.arc;
  el.querySelector('.arctog').onclick = () => { el.classList.toggle('open'); const o = el.classList.contains('open'); try { localStorage.setItem('arc_open_' + id, o ? '1' : '0'); } catch (e) { } el.querySelector('.arctog').textContent = o ? 'hide beats' : el.querySelectorAll('.beats li').length + ' beats'; };
  el.querySelector('.arcedit').onclick = () => { el.classList.add('editing'); const ta = el.querySelector('.arcb'); [el.querySelector('.arca'), ta].forEach(t => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 4) + 'px'; }); el.querySelector('.arca').focus(); };
  el.querySelector('.arccancel').onclick = () => el.classList.remove('editing');
  el.querySelectorAll('.arcform textarea').forEach(t => { t.oninput = () => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 4) + 'px'; }; t.onkeydown = ev => { if ((ev.metaKey || ev.ctrlKey) && ev.key === 's') { ev.preventDefault(); ev.stopPropagation(); el.querySelector('.arcsave').click(); } if (ev.key === 'Escape') el.classList.remove('editing'); }; });
  el.querySelector('.arcsave').onclick = async () => { const r = await post('/api/arc', { id, arc: el.querySelector('.arca').value, beats: el.querySelector('.arcb').value }); if (r.ok) { status('storyline saved', 'ok'); await load(); } else status(r.error, 'bad'); };
}
function renderChar(id) {
  const items = DATA.items.filter(i => i.who === id).sort((a, b) => a.file.localeCompare(b.file) || a.start - b.start);
  const name = DATA.names[id] || id; let h = `<h2>${name}<small>${items.length} lines</small></h2>`;
  h += arcHtml(id);
  const secs = []; for (const it of items) { const key = it.file + '#' + it.section; let s = secs.find(x => x.key === key); if (!s) { s = { key, file: it.file, section: it.section, items: [] }; secs.push(s); } s.items.push(it); }

  g.textAlign = 'left'; s.chords.forEach((ch, bi) => { const x = left + bi * s.bar * 2 * cw; g.fillStyle = bi % 2 ? '#1a1e25' : '#1e222a'; g.fillRect(x + 1, 19, s.bar * 2 * cw - 2, top - 21); g.fillStyle = '#7ad0c8'; g.font = '11px ' + getComputedStyle(document.body).fontFamily; g.fillText(noteName(s.key + ch[0]).replace(/\d/, '') + (ch[1] === 'm' ? 'm' : ''), x + 5, 36); g.fillStyle = '#3d4450'; g.font = '9px ' + getComputedStyle(document.body).fontFamily; g.fillText(String(bi + 1), x + s.bar * 2 * cw - 12, 28); });
  g.fillStyle = '#6b7380'; g.font = '9px ' + getComputedStyle(document.body).fontFamily; g.textAlign = 'right'; g.fillText('chord', left - 6, 36); g.fillText('lyric', left - 6, 12);
  // lyrics
  const ly = M.view === 'alt' && s.alt ? s.alt.lyrics : s.lyrics; g.textAlign = 'left'; ly.forEach((l, i) => { const x = left + l[0] * 2 * cw; g.fillStyle = '#e8a86a'; g.fillRect(x, 2, 2, 16); g.fillStyle = '#c8ccd8'; g.font = '10px ' + getComputedStyle(document.body).fontFamily; const nx = ly[i + 1] ? left + ly[i + 1][0] * 2 * cw : left + cols * cw; g.save(); g.beginPath(); g.rect(x + 4, 0, nx - x - 6, 18); g.clip(); g.fillText(l[1], x + 5, 13); g.restore(); });
  // notes
  const notes = rollNotes(s); const I = SYNTH.inst(s); const col0 = I.melody.on ? '#e8c84a' : '#6b7380';
  for (const n of notes) { const x = left + n.start * cw, y = top + (rows - 1 - n.n) * rh; g.fillStyle = col0; g.fillRect(x + 1, y + 1, n.len * cw - 2, rh - 2); g.fillStyle = '#fff3b0'; g.fillRect(x + 1, y + 1, 2, rh - 2); g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x + n.len * cw - 4, y + 1, 3, rh - 2); }
  if (M.hover && M.hover.zone === 'roll' && !M.drag) { const x = left + M.hover.col * cw, y = top + (rows - 1 - M.hover.note) * rh; g.strokeStyle = 'rgba(232,200,74,0.6)'; g.strokeRect(x + 0.5, y + 0.5, cw - 1, rh - 1); }
  // playhead
  if (M.playing) { const beat = (M.ctx.currentTime - M.playing.t0) / M.playing.beat; const x = left + beat * 2 * cw; if (beat >= 0 && x < left + cols * cw) { g.fillStyle = '#e86a6a'; g.fillRect(Math.round(x), 0, 2, c.height); } }
}
// ---- preview: the game's synth on a context of our own ----
function musicCtx() { if (!M.ctx) { try { M.ctx = new (window.AudioContext || window.webkitAudioContext)(); M.master = M.ctx.createGain(); M.master.gain.value = +($('#mvol') ? $('#mvol').value : 1.4); M.master.connect(M.ctx.destination); } catch (e) { status('no audio here', 'bad'); return null; } } if (M.ctx.state === 'suspended') M.ctx.resume(); return M.ctx; }
function musicPlay(only) { musicStop(); if (!musicCtx()) return; const s = curSong(); const t0 = M.ctx.currentTime + 0.1; const r = SYNTH.schedule(M.ctx, M.master, s, t0, { only: only || null, mute: $('#mmute') && $('#mmute').checked }); M.playing = { t0, nodes: r.nodes, beat: r.beat, dur: r.dur, song: s };
  const tick = () => { if (!M.playing) return; const el = M.ctx.currentTime - M.playing.t0; if (el > M.playing.dur) { musicStop(); return; } const beat = el / M.playing.beat; const pos = $('#mpos'); if (pos && beat >= 0) { const bar = Math.floor(beat / s.bar) + 1, b = Math.floor(beat % s.bar) + 1; const ly = M.view === 'alt' && s.alt ? s.alt.lyrics : s.lyrics; let li = -1; ly.forEach((l, i) => { if (beat >= l[0] - 0.2) li = i; }); pos.textContent = `bar ${bar} · beat ${b}` + (li >= 0 && ly[li][1] ? '   "' + ly[li][1] + '"' : ''); }
    // scroll the roll along
    const wrap = document.querySelector('.mroll'); if (wrap && beat >= 0) { const x = ROLL.left + beat * 2 * ROLL.cw; if (x > wrap.scrollLeft + wrap.clientWidth - 80 || x < wrap.scrollLeft) wrap.scrollLeft = Math.max(0, x - 120); }
    rollDraw(); M.raf = requestAnimationFrame(tick); }; M.raf = requestAnimationFrame(tick); status('playing ' + s.title); }
function musicStop() { if (M.playing && M.ctx) SYNTH.hush(M.ctx, M.playing.nodes); M.playing = null; cancelAnimationFrame(M.raf); const pos = $('#mpos'); if (pos) pos.textContent = 'bar 1 · beat 1'; rollDraw(); }
async function musicSave() { if (!M.songs) return; const r = await post('/api/songs', { songs: M.songs }); if (r.ok) { M.dirty = false; status('songs saved; build index.html to hear them in the game', 'ok'); DATA.songs.list = JSON.parse(JSON.stringify(M.songs)); renderSide(); const b = $('#msave'); if (b) b.disabled = true; } else status(r.error, 'bad'); }

gitRefresh(true); setInterval(() => { if ($('#gitpop').style.display !== 'block') gitRefresh(true); }, 90000);
load();
