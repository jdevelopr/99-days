<title>99 Days</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; background:#07080c; height:100%; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family: monospace; color:#cfd3dc; touch-action:none; -webkit-user-select:none; user-select:none; }
  #wrap { position:relative; }
  #game { display:block; image-rendering: pixelated; image-rendering: crisp-edges; background:#07080c; outline:none; }
  #touch { position:fixed; inset:0; pointer-events:none; display:none; }
  #touch.on { display:block; }
  .tb { position:absolute; pointer-events:auto; width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.22); color:#dfe3ea; font: 14px monospace; display:flex; align-items:center; justify-content:center; }
  .tb:active, .tb.down { background:rgba(255,255,255,0.22); }
  #tl { left:18px; bottom:48px; } #tr { left:108px; bottom:48px; } #tu { left:63px; bottom:104px; } #td { left:63px; bottom:0px; height:44px; }
  #te { right:24px; bottom:60px; width:72px; height:72px; } #tx { right:108px; bottom:30px; } #tm { right:18px; top:14px; width:44px; height:44px; font-size:11px; }
  #hint { position:fixed; left:0; right:0; bottom:4px; text-align:center; font-size:11px; color:#5c6270; pointer-events:none; }
</style>
<div id="wrap"><canvas id="game" width="480" height="270" tabindex="0"></canvas></div>
<div id="touch">
  <div class="tb" id="tl" data-k="ArrowLeft">&#9664;</div>
  <div class="tb" id="tr" data-k="ArrowRight">&#9654;</div>
  <div class="tb" id="tu" data-k="ArrowUp">&#9650;</div>
  <div class="tb" id="td" data-k="ArrowDown">&#9660;</div>
  <div class="tb" id="te" data-k="KeyE">E</div>
  <div class="tb" id="tx" data-k="KeyX">X</div>
  <div class="tb" id="tm" data-k="Escape">MENU</div>
</div>
<div id="hint"></div>
