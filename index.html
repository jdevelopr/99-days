<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>99 Days</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: dark; --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --sb: env(safe-area-inset-bottom, 0px); --st: env(safe-area-inset-top, 0px); }
  html, body { margin:0; padding:0; background:#07080c; height:100%; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; align-items:center; justify-content:center; font-family: monospace; color:#cfd3dc; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #wrap { position:relative; }
  #game { display:block; image-rendering: pixelated; image-rendering: crisp-edges; background:#07080c; outline:none; }
  #touch { position:fixed; inset:0; pointer-events:none; display:none; }
  #touch.on { display:block; }
  .tb { position:absolute; pointer-events:auto; width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.28); color:#eef1f6; font: bold 16px monospace; display:flex; align-items:center; justify-content:center; box-shadow: 0 0 0 4px rgba(0,0,0,0.12); backdrop-filter: blur(2px); }
  .tb:active, .tb.down { background:rgba(255,255,255,0.30); }
  /* d-pad cluster, bottom-left; actions bottom-right; menu top-right; all inside the safe area */
  #tl { left:calc(var(--sl) + 16px); bottom:calc(var(--sb) + 58px); } #tr { left:calc(var(--sl) + 132px); bottom:calc(var(--sb) + 58px); }
  #tu { left:calc(var(--sl) + 74px); bottom:calc(var(--sb) + 112px); } #td { left:calc(var(--sl) + 74px); bottom:calc(var(--sb) + 6px); }
  #te { right:calc(var(--sr) + 22px); bottom:calc(var(--sb) + 64px); width:82px; height:82px; font-size:22px; } #tx { right:calc(var(--sr) + 116px); bottom:calc(var(--sb) + 26px); }
  #tm { right:calc(var(--sr) + 16px); top:calc(var(--st) + 12px); width:50px; height:36px; border-radius:10px; font-size:11px; }
  #tf { left:calc(var(--sl) + 16px); top:calc(var(--st) + 12px); width:50px; height:36px; border-radius:10px; font-size:11px; }
  #hint { position:fixed; left:0; right:0; bottom:4px; text-align:center; font-size:11px; color:#5c6270; pointer-events:none; }
  #touch.on ~ #hint { display:none; }
  /* portrait phones: ask for landscape */
  #rotate { position:fixed; inset:0; background:#07080c; color:#cfd3dc; display:none; align-items:center; justify-content:center; text-align:center; font: 16px monospace; z-index:20; padding:24px; }
  #rotate .ph { width:26px; height:46px; border:2px solid #8a92a4; border-radius:5px; margin:0 auto 18px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%,25% { transform: rotate(0deg); } 60%,100% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="270" tabindex="0"></canvas></div>
<div id="touch">
  <div class="tb" id="tl" data-k="ArrowLeft">&#9664;</div>
  <div class="tb" id="tr" data-k="ArrowRight">&#9654;</div>
  <div class="tb" id="tu" data-k="ArrowUp">&#9650;</div>
  <div class="tb" id="td" data-k="ArrowDown">&#9660;</div>
  <div class="tb" id="te" data-k="KeyE">E</div>
  <div class="tb" id="tx" data-k="KeyX">X</div>
  <div class="tb" id="tm" data-k="Escape">MENU</div>
  <div class="tb" id="tf">FULL</div>
</div>
<div id="rotate"><div><div class="ph"></div>Turn your phone sideways.<br><span style="color:#5c6270;font-size:12px">99 Days plays in landscape.</span></div></div>
<div id="hint"></div>

<script>
(function(){
"use strict";
// ---- 01_core.js ----
// ============================================================
// 99 DAYS — core: canvas, scaling, input, rng, audio, utils
// ============================================================
const W = 480, H = 270;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

function mkCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  return [c, g];
}

let SCALE = 1;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  const fit = Math.min(ww / W, wh / H);
  // desktop: whole-pixel scale for crisp pixels; phones and tablets: fill the height, with gutters either side for the controls
  if (IS_TOUCH && ww > wh) {
    const gut = Math.max(106, Math.round(ww * 0.125));
    SCALE = Math.min((ww - 2 * gut) / W, wh / H);
    layoutTouch(ww, wh, gut);
  } else SCALE = IS_TOUCH ? fit : Math.max(1, Math.floor(fit));
  if (ww < W || wh < H) SCALE = Math.min(SCALE, fit);
  canvas.style.width = (W * SCALE) + 'px';
  canvas.style.height = (H * SCALE) + 'px';
}
// put the touch buttons in the black gutters beside the game so nothing covers the scene
function layoutTouch(ww, wh, gut) {
  const q = id => document.getElementById(id); const S = (el, x, y, w) => { if (!el) return; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.right = 'auto'; el.style.bottom = 'auto'; if (w) { el.style.width = w + 'px'; el.style.height = w + 'px'; } };
  const sl = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sl')) || 0, sr = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sr')) || 0;
  const bw = Math.min(58, Math.floor((gut - 8) / 2)); const lx = sl + gut / 2, rx = ww - sr - gut / 2; const midY = wh * 0.58;
  S(q('tu'), lx - bw / 2, midY - bw * 1.55, bw); S(q('tl'), lx - bw - 2, midY - bw / 2, bw); S(q('tr'), lx + 2, midY - bw / 2, bw); S(q('td'), lx - bw / 2, midY + bw * 0.55, bw);
  const ew = Math.min(84, gut - 12); S(q('te'), rx - ew / 2, midY - ew / 2 - 6, ew); S(q('tx'), rx - bw / 2, midY + ew / 2 + 8, bw);
  const tm = q('tm'), tf = q('tf'); if (tm) { tm.style.left = (rx - 25) + 'px'; tm.style.top = '10px'; tm.style.right = 'auto'; tm.style.bottom = 'auto'; } if (tf) { tf.style.left = (lx - 25) + 'px'; tf.style.top = '10px'; tf.style.right = 'auto'; tf.style.bottom = 'auto'; }
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200)); resize();

// ---------- utils ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rnd = (a, b) => Math.random() * (b - a) + a;
const irnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function seeded(seed) { // mulberry32
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbStr(r, g, b, a) { return a === undefined ? `rgb(${r|0},${g|0},${b|0})` : `rgba(${r|0},${g|0},${b|0},${a})`; }
function mixHex(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return rgbStr(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function mixRgb(A, B, t) { return [lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)]; }

// ---------- input ----------
const Input = {
  down: {}, pressed: {}, _queue: [], touch: false, gamepadSeen: false,
  map: {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    KeyE: 'act', Enter: 'act', Space: 'act', KeyX: 'back', Escape: 'menu', Backspace: 'back',
    KeyM: 'mute', KeyQ: 'back'
  },
  raw: [], _rawQ: [], _tap: null, tap: null,
  press(code) { this._rawQ.push(code); const k = this.map[code]; if (!k) return; if (!this.down[k]) this._queue.push(k); this.down[k] = true; },
  release(code) { const k = this.map[code]; if (!k) return; this.down[k] = false; },
  beginFrame() { this.pressed = {}; for (const k of this._queue) this.pressed[k] = true; this._queue.length = 0; this.raw = this._rawQ; this._rawQ = []; this.tap = this._tap; this._tap = null; this.pollGamepad(); },
  digit() { for (const c of this.raw) { const m = /^(?:Digit|Numpad)(\d)$/.exec(c); if (m) return +m[1]; } return null; },
  hit(k) { return !!this.pressed[k]; },
  held(k) { return !!this.down[k]; },
  anyHit() { return Object.keys(this.pressed).length > 0; },
  gp: { prev: {} },
  pollGamepad() {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    let g = null; for (const x of gps) if (x) { g = x; break; }
    if (!g) return;
    this.gamepadSeen = true;
    const st = {};
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    st.left = ax < -0.5 || (g.buttons[14] && g.buttons[14].pressed);
    st.right = ax > 0.5 || (g.buttons[15] && g.buttons[15].pressed);
    st.up = ay < -0.5 || (g.buttons[12] && g.buttons[12].pressed);
    st.down = ay > 0.5 || (g.buttons[13] && g.buttons[13].pressed);
    st.act = (g.buttons[0] && g.buttons[0].pressed) || (g.buttons[2] && g.buttons[2].pressed);
    st.back = (g.buttons[1] && g.buttons[1].pressed);
    st.menu = (g.buttons[9] && g.buttons[9].pressed);
    for (const k in st) {
      if (st[k] && !this.gp.prev[k]) { this.pressed[k] = true; this.down[k] = true; this.gpHeld = this.gpHeld || {}; this.gpHeld[k] = true; }
      if (!st[k] && this.gp.prev[k]) { if (this.gpHeld && this.gpHeld[k]) { this.down[k] = false; this.gpHeld[k] = false; } }
    }
    this.gp.prev = st;
  }
};
window.addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  Input.press(e.code); Audio.unlock();
});
window.addEventListener('keyup', e => Input.release(e.code));
window.addEventListener('blur', () => { Input.down = {}; });

// touch controls
(function setupTouch() {
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const layer = document.getElementById('touch');
  if (!isTouch) return;
  Input.touch = true; layer.classList.add('on');
  // fullscreen + landscape lock (Android honours the lock; iOS just goes full-bleed)
  const fs = document.getElementById('tf');
  const goFull = async () => { try { const el = document.documentElement; if (!document.fullscreenElement) { if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' }); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } else if (document.exitFullscreen) await document.exitFullscreen(); } catch (e) { } try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) { } setTimeout(resize, 300); };
  fs.addEventListener('touchstart', e => { e.preventDefault(); Audio.unlock(); goFull(); }, { passive: false });
  fs.addEventListener('mousedown', e => { e.preventDefault(); goFull(); });
  if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) fs.style.display = 'none';
  document.addEventListener('fullscreenchange', () => { fs.textContent = document.fullscreenElement ? 'EXIT' : 'FULL'; setTimeout(resize, 200); });
  for (const b of layer.querySelectorAll('.tb')) {
    const code = b.dataset.k; if (!code) continue;
    const dn = e => { e.preventDefault(); b.classList.add('down'); Input.press(code); Audio.unlock(); };
    const up = e => { e.preventDefault(); b.classList.remove('down'); Input.release(code); };
    b.addEventListener('touchstart', dn, { passive: false }); b.addEventListener('touchend', up, { passive: false });
    b.addEventListener('touchcancel', up, { passive: false });
    b.addEventListener('mousedown', dn); b.addEventListener('mouseup', up); b.addEventListener('mouseleave', up);
  }
  // tap on canvas acts as "act" (advances dialogue)
  canvas.addEventListener('touchstart', e => { e.preventDefault(); Input.press('KeyE'); Audio.unlock(); setTimeout(() => Input.release('KeyE'), 60); }, { passive: false });
})();
canvas.addEventListener('mousedown', () => { Audio.unlock(); canvas.focus(); });
canvas.addEventListener('pointerdown', e => { const r = canvas.getBoundingClientRect(); Input._tap = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; });

// ---------- audio (procedural, tiny) ----------
const Audio = {
  ctx: null, master: null, muted: false, rainGain: null, rainNode: null, _unlocked: false,
  unlock() {
    if (this._unlocked) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
      this._unlocked = true; this.startRain();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { }
  },
  startRain() {
    const c = this.ctx; const len = c.sampleRate * 2; const buf = c.createBuffer(1, len, c.sampleRate); const d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = (w * 0.35 + last * 3) * 0.5; }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 0.4;
    const g = c.createGain(); g.gain.value = 0; src.connect(f); f.connect(g); g.connect(this.master); src.start();
    this.rainGain = g; this.rainFilter = f;
    if (typeof G !== 'undefined' && G && G.weather) this.setWeather(G.weather, G.rain, G.snowing);
  },
  // rain and sleet hiss; snow is a softer, lower hush; anything else is quiet
  setWeather(kind, rain, snowing) {
    if (!this.rainGain) return; let lvl = 0, fq = 2200;
    if (kind === 'rain' || kind === 'sleet') lvl = rain || 0; else if (kind === 'snow') { lvl = 0.3 * (snowing || 0.6); fq = 650; }
    const now = this.ctx.currentTime; if (this.rainFilter) this.rainFilter.frequency.setTargetAtTime(fq, now, 0.8);
    this.rainGain.gain.setTargetAtTime(this.muted ? 0 : lvl * 0.35, now, 0.8); this.weatherLevel = lvl;
  },
  setRain(level) { if (!this.rainGain) return; if (typeof G !== 'undefined' && G && G.weather && level > 0) { this.setWeather(G.weather, G.rain, G.snowing); return; } this.rainGain.gain.setTargetAtTime(this.muted ? 0 : level * 0.35, this.ctx.currentTime, 0.8); },
  tone(freq, dur, type, vol, slide) {
    if (!this._unlocked || this.muted) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square'; o.frequency.value = freq; if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), c.currentTime + dur);
    g.gain.value = vol || 0.08; g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(this.master); o.start(); o.stop(c.currentTime + dur + 0.02);
  },
  blip() { this.tone(660, 0.05, 'square', 0.04); },
  sel() { this.tone(520, 0.08, 'triangle', 0.06, 1.5); },
  back() { this.tone(300, 0.08, 'triangle', 0.05, 0.6); },
  coin() { this.tone(880, 0.07, 'square', 0.05); setTimeout(() => this.tone(1320, 0.12, 'square', 0.05), 60); },
  eat() { this.tone(200, 0.1, 'sawtooth', 0.04, 0.5); },
  good() { [523, 659, 784].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, 'triangle', 0.06), i * 90)); },
  sad() { [392, 349, 311].forEach((f, i) => setTimeout(() => this.tone(f, 0.35, 'triangle', 0.05), i * 160)); },
  bad() { this.tone(140, 0.25, 'sawtooth', 0.06, 0.5); },
  step() { this.tone(90 + Math.random() * 40, 0.04, 'triangle', 0.025); },
  chord(notes, dur) { notes.forEach(f => this.tone(f, dur || 1.2, 'sine', 0.05)); },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.5; }
};

// glyph metrics (trimmed proportional width)
const GLYPH = {};
for (const ch in FONT) {
  const rows = FONT[ch]; let minx = 5, maxx = -1;
  for (const r of rows) for (let x = 0; x < 5; x++) if (r[x] === '#') { if (x < minx) minx = x; if (x > maxx) maxx = x; }
  if (maxx < 0) { minx = 0; maxx = 2; }
  GLYPH[ch] = { rows, x0: minx, w: maxx - minx + 1 };
}
const glyphCache = {};
function glyphCanvas(ch, color) {
  const key = ch + color; if (glyphCache[key]) return glyphCache[key];
  const g = GLYPH[ch] || GLYPH['?'];
  const [c, gc] = mkCanvas(g.w, FONT_H); gc.fillStyle = color;
  for (let y = 0; y < g.rows.length; y++) for (let x = 0; x < 5; x++) if (g.rows[y][x] === '#') gc.fillRect(x - g.x0, y, 1, 1);
  glyphCache[key] = c; return c;
}
function normChar(ch) {
  if (ch === '’' || ch === '‘') return "'";
  if (ch === '“' || ch === '”') return '"';
  if (ch === '—' || ch === '–') return '-';
  if (ch === '…') return '.';
  return GLYPH[ch] ? ch : '?';
}
function textWidth(str) {
  let w = 0;
  for (let i = 0; i < str.length; i++) { const ch = normChar(str[i]); w += (ch === ' ' ? 3 : GLYPH[ch].w) + 1; }
  return Math.max(0, w - 1);
}
function drawText(g, str, x, y, color, opts) {
  opts = opts || {};
  if (opts.align === 'center') x -= Math.floor(textWidth(str) / 2);
  else if (opts.align === 'right') x -= textWidth(str);
  if (opts.shadow) { drawText(g, str, x + 1, y + 1, opts.shadow); }
  let cx = x;
  for (let i = 0; i < str.length; i++) {
    const ch = normChar(str[i]);
    if (ch === ' ') { cx += 4; continue; }
    g.drawImage(glyphCanvas(ch, color), cx, y); cx += GLYPH[ch].w + 1;
  }
  return cx - x;
}
function wrapText(str, maxW) {
  const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (textWidth(t) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ---------- sprites ----------
// A sprite is rows of chars; palette maps char -> css color. '.' = transparent.
const spriteCache = {};
function mkSprite(rows, pal, key) {
  if (key && spriteCache[key]) return spriteCache[key];
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const [c, g] = mkCanvas(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    const col = pal[ch]; if (!col) continue;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  if (key) spriteCache[key] = c;
  return c;
}
function flipH(c) {
  const [f, g] = mkCanvas(c.width, c.height);
  g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return f;
}
// silhouette (for shadows): same alpha, solid color
function silhouette(c, color) {
  const [s, g] = mkCanvas(c.width, c.height);
  g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return s;
}
// tint overlay
function tinted(c, color, alpha) {
  const [s, g] = mkCanvas(c.width, c.height);
  g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-atop'; g.globalAlpha = alpha; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return s;
}

// art: procedural humanoid pixel sprites, props
// ============================================================
// helper: darken/lighten a hex color
function shade(hex, amt) { const [r, g, b] = hexToRgb(hex); return rgbStr(clamp(r + amt, 0, 255), clamp(g + amt, 0, 255), clamp(b + amt, 0, 255)); }
function px(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }

// A humanoid is drawn facing RIGHT into a 24x40 canvas; feet baseline at y=38, center x=12.
// spec: { skin, hair, hairStyle, shirt, pants, shoes, coat, hat, hatColor, beard, apron, glasses, hunch, cane, short, dress, scarf, vest, tie }
// pose: { frame (0..3 walk), walk (bool), sit (bool), bob }
const HUMAN_W = 24, HUMAN_H = 40;
function drawHumanoid(spec, pose) {
  const [c, g] = mkCanvas(HUMAN_W, HUMAN_H);
  const cx = 12, feet = 38;
  const skin = spec.skin, skinD = shade(spec.skin, -35);
  const hair = spec.hair, hairD = shade(spec.hair, -30);
  const shirt = spec.shirt, shirtD = shade(spec.shirt, -35);
  const pants = spec.pants, pantsD = shade(spec.pants, -30);
  const shoes = spec.shoes || '#221e1c';
  const outline = '#0d0c10';
  const hunch = spec.hunch ? 1 : 0;
  const h = spec.short ? -3 : 0; // shorter characters (kids/old)
  const walk = pose.walk, f = pose.frame || 0, sit = pose.sit;
  const bob = walk ? (f === 1 || f === 3 ? -1 : 0) : 0;
  // leg offsets
  let fl = 0, bl = 0; // front / back leg horizontal offsets
  if (walk) { const sw = [3, 1, -3, -1][f]; fl = sw; bl = -sw; }
  const hipY = feet - 13 + h;

  if (sit) {
    // seated: legs forward, torso upright, feet at baseline
    const seatY = feet - 8;
    // back leg (further from viewer)
    px(g, cx - 1, seatY - 6, 4, 5, pantsD);      // thigh
    px(g, cx + 3, seatY - 6, 6, 4, pantsD);
    px(g, cx + 7, seatY - 3, 3, 9, pantsD);      // shin down
    px(g, cx + 7, feet - 2, 5, 2, shoes);
    // front leg
    px(g, cx - 3, seatY - 5, 8, 5, pants);
    px(g, cx + 4, seatY - 5, 3, 4, pants);
    px(g, cx + 3, seatY - 2, 3, 8, pants);
    px(g, cx + 3, feet - 2, 6, 2, shoes);
    px(g, cx + 3, feet - 2, 6, 1, shade(shoes, 25));
    drawTorso(g, cx, seatY - 5, 0);
  } else {
    // legs
    drawLeg(g, cx - 3 + bl, hipY, feet, pantsD, shade(shoes, -10), false, bl);
    drawLeg(g, cx + 0 + fl, hipY, feet, pants, shoes, true, fl);
    drawTorso(g, cx, hipY, bob);
  }

  function drawLeg(g, x, top, bottom, col, shoeCol, front, off) {
    const len = bottom - top - 2;
    // thigh + shin as slightly bent column
    px(g, x, top, 4, Math.ceil(len / 2), col);
    const kneeX = x + (off > 0 ? 1 : off < 0 ? -1 : 0) * 0 ;
    px(g, kneeX, top + Math.ceil(len / 2), 4, Math.floor(len / 2), col);
    if (front) px(g, x + 3, top, 1, len, shade(col, -25)); // side shading
    // shoe
    px(g, kneeX - (off < 0 ? 1 : 0), bottom - 2, 6, 2, shoeCol);
    px(g, kneeX + 4, bottom - 2, 1, 1, shade(shoeCol, 30));
    px(g, kneeX, bottom - 1, 6, 1, shade(shoeCol, -30));
  }

  function drawTorso(g, cx, hipY, bob) {
    const torsoTop = hipY - 12 + bob + hunch;
    const tw = 10, tx = cx - 5;
    // coat (longer, wider)
    if (spec.coat) {
      const coat = spec.coat, coatD = shade(coat, -30);
      px(g, tx - 1, torsoTop, tw + 2, 12 + (sit ? 2 : 5), coat);
      px(g, tx - 1, torsoTop, 2, 12 + (sit ? 2 : 5), coatD);
      px(g, tx + 4, torsoTop + 1, 1, 12, coatD); // lapel line
      px(g, tx + 5, torsoTop + 1, 1, 12, shade(coat, 15));
      if (spec.torn) { px(g, tx - 1, torsoTop + 14, 3, 1, 'rgba(0,0,0,0)'); g.clearRect(tx - 1, torsoTop + 15, 2, 2); g.clearRect(tx + 8, torsoTop + 13, 2, 3); }
    } else if (spec.dress) {
      px(g, tx, torsoTop, tw, 12, shirt);
      px(g, tx, torsoTop, 2, 12, shirtD);
      // skirt
      px(g, tx - 1, hipY - 1, tw + 2, 9, shirt);
      px(g, tx - 1, hipY - 1, 2, 9, shirtD);
      px(g, tx - 1, hipY + 7, tw + 2, 1, shirtD);
    } else {
      px(g, tx, torsoTop, tw, 12, shirt);
      px(g, tx, torsoTop, 2, 12, shirtD);
      px(g, tx + tw - 1, torsoTop, 1, 12, shade(shirt, 12));
    }
    if (spec.vest) { const v = spec.vest; px(g, tx + 1, torsoTop + 1, tw - 2, 10, v); px(g, tx + 1, torsoTop + 4, tw - 2, 1, '#e8e4c8'); px(g, tx + 1, torsoTop + 8, tw - 2, 1, '#e8e4c8'); }
    if (spec.apron) { const a = spec.apron; px(g, tx + 2, torsoTop + 3, tw - 3, 9 + (sit ? 0 : 7), a); px(g, tx + 2, torsoTop + 3, 1, 16, shade(a, -25)); px(g, tx + 5, torsoTop + 1, 1, 2, shade(a, -25)); }
    if (spec.tie) px(g, tx + 6, torsoTop + 1, 1, 6, spec.tie);
    // arms
    const swing = walk ? [2, 0, -2, 0][f] : 0;
    const sleeve = spec.coat || (spec.dress ? shirt : shirt);
    const sleeveD = shade(sleeve, -35);
    // back arm
    px(g, tx - 1 + (sit ? 1 : -swing), torsoTop + 2, 3, 9, sleeveD);
    px(g, tx - 1 + (sit ? 1 : -swing), torsoTop + 11, 3, 2, skinD);
    // front arm
    px(g, tx + tw - 2 + (sit ? 0 : swing), torsoTop + 2, 3, 9, sleeve);
    px(g, tx + tw - 2 + (sit ? 0 : swing), torsoTop + 2, 1, 9, sleeveD);
    px(g, tx + tw - 2 + (sit ? 0 : swing), torsoTop + 11, 3, 2, skin);
    if (spec.cane && !sit) { px(g, tx + tw + 1, torsoTop + 12, 1, 15, '#5a3b22'); px(g, tx + tw, torsoTop + 11, 3, 1, '#7a5432'); }
    if (spec.guitar && !walk) { px(g, tx - 2, torsoTop + 6, 14, 6, '#8a5a2a'); px(g, tx + 1, torsoTop + 7, 5, 4, '#2a1a0a'); px(g, tx + 10, torsoTop + 5, 8, 1, '#3a2a1a'); }
    // neck
    const neckY = torsoTop - 2;
    px(g, cx - 1, neckY, 3, 2, skinD);
    // head (8w x 9h), positioned slightly forward when hunched
    const hx = cx - 3 + hunch, hy = neckY - 9 + hunch;
    px(g, hx, hy, 8, 9, skin);
    px(g, hx, hy, 1, 9, skinD);           // back of head shade
    px(g, hx + 1, hy + 8, 6, 1, skinD);   // jaw shade
    px(g, hx - 1, hy + 4, 1, 3, skinD);   // ear-ish (back)
    // eye + brow + mouth (facing right)
    px(g, hx + 5, hy + 4, 1, 1, '#1a1418');
    if (spec.old) { px(g, hx + 4, hy + 5, 2, 1, skinD); px(g, hx + 6, hy + 3, 1, 1, skinD); }
    px(g, hx + 5, hy + 7, 2, 1, skinD);
    if (spec.glasses) { px(g, hx + 4, hy + 3, 3, 2, 'rgba(40,50,70,0.75)'); px(g, hx + 4, hy + 3, 3, 1, '#2a2a30'); px(g, hx + 1, hy + 3, 3, 1, '#2a2a30'); }
    // hair
    const hs = spec.hairStyle || 'short';
    if (hs !== 'bald') {
      px(g, hx - 1, hy - 1, 9, 3, hair);                   // top
      px(g, hx - 1, hy + 2, 2, 4, hair);                   // back
      px(g, hx - 1, hy - 1, 3, 2, hairD);
      if (hs === 'short') { px(g, hx + 6, hy + 1, 2, 1, hair); }
      if (hs === 'messy') { px(g, hx + 1, hy - 2, 2, 1, hair); px(g, hx + 4, hy - 2, 2, 1, hair); px(g, hx + 6, hy + 1, 2, 2, hair); px(g, hx - 2, hy + 1, 1, 3, hair); }
      if (hs === 'long') { px(g, hx - 2, hy + 2, 3, 10, hair); px(g, hx - 2, hy + 2, 1, 10, hairD); px(g, hx + 6, hy + 1, 2, 2, hair); }
      if (hs === 'ponytail') { px(g, hx - 3, hy + 1, 3, 3, hair); px(g, hx - 4, hy + 3, 2, 8, hair); px(g, hx - 4, hy + 3, 1, 8, hairD); px(g, hx + 6, hy + 1, 2, 1, hair); }
      if (hs === 'bun') { px(g, hx - 3, hy - 1, 3, 3, hair); px(g, hx - 3, hy - 1, 1, 3, hairD); }
      if (hs === 'thin') { g.clearRect(hx + 1, hy - 1, 5, 1); px(g, hx + 1, hy - 1, 5, 1, skin); px(g, hx - 1, hy, 2, 5, hair); px(g, hx + 6, hy + 1, 1, 1, hair); }
      if (hs === 'buzz') { px(g, hx - 1, hy - 1, 9, 2, hair); }
      if (hs === 'afro') { px(g, hx - 2, hy - 3, 11, 5, hair); px(g, hx - 3, hy - 1, 2, 7, hair); px(g, hx - 2, hy - 3, 3, 3, hairD); }
      if (hs === 'wavy') { px(g, hx - 2, hy + 1, 2, 6, hair); px(g, hx + 6, hy + 1, 3, 2, hair); px(g, hx + 7, hy + 3, 1, 1, hair); }
    }
    if (spec.beard) { const b = spec.beard; px(g, hx + 1, hy + 6, 7, 3, b); px(g, hx + 2, hy + 9, 5, spec.longBeard ? 3 : 1, b); px(g, hx + 5, hy + 6, 2, 1, skin); }
    if (spec.hat === 'beanie') { const hc = spec.hatColor || '#4a4a52'; px(g, hx - 1, hy - 2, 9, 4, hc); px(g, hx - 1, hy - 2, 2, 4, shade(hc, -30)); px(g, hx - 1, hy + 1, 9, 1, shade(hc, -20)); px(g, hx + 1, hy - 3, 5, 1, hc); }
    if (spec.hat === 'cap') { const hc = spec.hatColor || '#2a3a6a'; px(g, hx - 1, hy - 2, 9, 3, hc); px(g, hx - 1, hy - 2, 2, 3, shade(hc, -30)); px(g, hx + 5, hy, 6, 1, hc); }
    if (spec.hat === 'hood') { const hc = spec.hatColor || spec.coat; px(g, hx - 2, hy - 2, 10, 11, hc); px(g, hx - 2, hy - 2, 2, 11, shade(hc, -30)); px(g, hx + 1, hy + 1, 7, 8, skin); px(g, hx + 5, hy + 4, 1, 1, '#1a1418'); px(g, hx + 5, hy + 7, 2, 1, skinD); }
    if (spec.scarf) { px(g, cx - 3, neckY - 1, 8, 3, spec.scarf); px(g, cx - 3, neckY + 2, 3, 4, spec.scarf); }
    if (spec.stubble) { px(g, hx + 2, hy + 7, 6, 2, 'rgba(20,20,20,0.25)'); }
    if (spec.bandage) { px(g, hx + 2, hy + 1, 4, 2, '#ddd6c8'); }
    if (spec.grime) { px(g, hx + 2, hy + 3, 1, 1, 'rgba(30,25,20,0.35)'); px(g, hx + 6, hy + 6, 1, 2, 'rgba(30,25,20,0.35)'); px(g, tx + 2, torsoTop + 6, 3, 2, 'rgba(30,25,20,0.3)'); }
  }
  return c;
}

// Build animated frames for a spec; cache by spec key
const charFrameCache = {};
function charFrames(spec) {
  const key = JSON.stringify(spec);
  if (charFrameCache[key]) return charFrameCache[key];
  const idle = drawHumanoid(spec, { walk: false, frame: 0 });
  const walk = [0, 1, 2, 3].map(f => drawHumanoid(spec, { walk: true, frame: f }));
  const sit = drawHumanoid(spec, { sit: true });
  const fr = { idle, walk, sit, idleL: flipH(idle), walkL: walk.map(flipH), sitL: flipH(sit) };
  fr.sil = silhouette(idle, '#000'); fr.silWalk = walk.map(w => silhouette(w, '#000')); fr.silSit = silhouette(sit, '#000');
  fr.silL = flipH(fr.sil); fr.silWalkL = fr.silWalk.map(flipH); fr.silSitL = flipH(fr.silSit);
  charFrameCache[key] = fr; return fr;
}

// world: scene definitions, procedural buildings & interiors

const GROUND_Y = 206;   // where walls meet sidewalk
const FEET_Y = 221;     // where characters stand
const CURB_Y = 224;     // sidewalk/road edge
const GF_H = 48, FLOOR_H = 50;  // ground floor / upper floor pitch (2.2m / 2.25m)

// ---- brick / wall painters ----
function paintBrick(g, x, y, w, h, base, seed) {
  const R = seeded(seed);
  const b0 = base, b1 = shade(base, -10), b2 = shade(base, 8), mortar = shade(base, -28);
  px(g, x, y, w, h, b0);
  for (let yy = 0; yy < h; yy += 4) {
    const off = (Math.floor(yy / 4) % 2) * 4;
    px(g, x, y + yy + 3, w, 1, mortar);
    for (let xx = -off; xx < w; xx += 8) {
      const r = R();
      if (r < 0.18) px(g, x + Math.max(0, xx), y + yy, Math.min(7, w - Math.max(0, xx)), 3, b1);
      else if (r < 0.28) px(g, x + Math.max(0, xx), y + yy, Math.min(7, w - Math.max(0, xx)), 3, b2);
      if (xx + 7 < w && xx + 7 >= 0) px(g, x + xx + 7, y + yy, 1, 3, mortar);
    }
  }
}
function paintConcrete(g, x, y, w, h, base, seed) {
  const R = seeded(seed);
  px(g, x, y, w, h, base);
  for (let i = 0; i < w * h / 30; i++) { px(g, x + Math.floor(R() * w), y + Math.floor(R() * h), 1 + Math.floor(R() * 3), 1, shade(base, R() < 0.5 ? -8 : 6)); }
  // panel lines
  for (let yy = 12; yy < h; yy += 14) px(g, x, y + yy, w, 1, shade(base, -14));
  // grime streaks
  for (let i = 0; i < w / 18; i++) { const sx = x + Math.floor(R() * w); px(g, sx, y + Math.floor(R() * h * 0.5), 1, Math.floor(R() * h * 0.5), 'rgba(0,0,0,0.12)'); }
}
function paintCorrugated(g, x, y, w, h, base) {
  px(g, x, y, w, h, base);
  for (let xx = 0; xx < w; xx += 3) { px(g, x + xx, y, 1, h, shade(base, -14)); px(g, x + xx + 2, y, 1, h, shade(base, 8)); }
}
// window with frame; returns a "light" spec for the night layer
function paintWindow(g, x, y, w, h, style, seed) {
  const R = seeded(seed);
  const frame = style === 'concrete' ? '#3a3e48' : '#2a2226';
  px(g, x - 1, y - 1, w + 2, h + 2, frame);
  const glass = ['#2a3445', '#26303e', '#303a4a'][Math.floor(R() * 3)];
  px(g, x, y, w, h, glass);
  px(g, x + 1, y + 1, Math.floor(w / 2) - 1, Math.floor(h / 2) - 1, shade(glass, 12)); // reflection
  px(g, x + Math.floor(w / 2), y, 1, h, frame); px(g, x, y + Math.floor(h / 2), w, 1, frame); // muntins
  px(g, x - 2, y + h + 1, w + 4, 1, shade(frame, 30)); // sill
  // curtains / blinds variation
  const v = R();
  if (v < 0.25) { px(g, x, y, w, Math.floor(h * 0.4), '#5a4a3a'); px(g, x, y, w, 1, '#7a6a5a'); }
  else if (v < 0.4) { px(g, x, y, Math.floor(w * 0.3), h, '#6a3a3a'); px(g, x + w - Math.floor(w * 0.3), y, Math.floor(w * 0.3), h, '#6a3a3a'); }
  else if (v < 0.5) { for (let yy = 1; yy < h; yy += 2) px(g, x, y + yy, w, 1, shade(glass, 18)); }
  return { x, y, w, h, lit: R() < 0.45, warm: R() < 0.7, flicker: R() < 0.1 };
}

// ---- building painter: draws into static layer, returns lights + gap info ----
function paintBuilding(g, b, lights, signs) {
  const R = seeded(b.seed || 1);
  const top = GROUND_Y - b.h;
  const style = b.style || 'brick';
  if (style === 'brick') paintBrick(g, b.x, top, b.w, b.h, b.color, b.seed);
  else if (style === 'concrete') paintConcrete(g, b.x, top, b.w, b.h, b.color, b.seed);
  else if (style === 'corrugated') paintCorrugated(g, b.x, top, b.w, b.h, b.color);
  // roof cap
  px(g, b.x - 1, top - 2, b.w + 2, 2, shade(b.color, -40));
  px(g, b.x - 1, top - 3, b.w + 2, 1, shade(b.color, 20));
  // roof details
  if (b.roof !== false) {
    let rx = b.x + 8;
    while (rx < b.x + b.w - 20) {
      const r = R();
      if (r < 0.3) { px(g, rx, top - 10, 10, 8, '#3a3a42'); px(g, rx + 1, top - 9, 8, 6, '#4a4a54'); px(g, rx + 3, top - 7, 4, 2, '#2a2a30'); }
      else if (r < 0.45) { px(g, rx + 3, top - 22, 1, 20, '#5a5a62'); px(g, rx, top - 20, 7, 1, '#5a5a62'); px(g, rx + 1, top - 16, 5, 1, '#5a5a62'); }
      else if (r < 0.55) { px(g, rx, top - 14, 14, 10, '#4a3a2a'); px(g, rx + 1, top - 15, 12, 2, '#5a4a3a'); px(g, rx + 2, top - 18, 10, 3, '#3a2a1a'); px(g, rx + 2, top - 4, 2, 4, '#2a2a30'); px(g, rx + 10, top - 4, 2, 4, '#2a2a30'); }
      else if (r < 0.65) { px(g, rx, top - 6, 16, 4, '#2a2a30'); px(g, rx + 2, top - 8, 12, 2, '#3a3a40'); }
      rx += 24 + Math.floor(R() * 30);
    }
  }
  // floors of windows (ground floor 2.2m, upper floors 2.25m, windows 0.8 x 1.1m)
  const floors = b.floors || 0;
  const wW = b.winW || 18, wH = b.winH || 24;
  const cols = Math.max(1, Math.floor((b.w - 16) / (wW + 18)));
  const gapX = (b.w - cols * wW) / (cols + 1);
  for (let f = 0; f < floors; f++) {
    const wy = GROUND_Y - GF_H - (f + 1) * FLOOR_H + 12;
    for (let c = 0; c < cols; c++) {
      const wx = Math.round(b.x + gapX + c * (wW + gapX));
      const L = paintWindow(g, wx, Math.round(wy), wW, wH, style, b.seed * 7 + f * 31 + c * 13);
      lights.push(L);
    }
  }
  // fire escape
  if (b.fireEscape) {
    const fx = b.x + b.w - 34;
    for (let f = 0; f < floors; f++) {
      const fy = GROUND_Y - GF_H - (f + 1) * FLOOR_H + 12 + wH + 3;
      px(g, fx, fy, 30, 1, '#1e1e24'); px(g, fx, fy - 8, 1, 8, '#1e1e24'); px(g, fx + 29, fy - 8, 1, 8, '#1e1e24');
      for (let i = 3; i < 30; i += 4) px(g, fx + i, fy - 7, 1, 7, '#2a2a32');
      px(g, fx + 4, fy + 1, 3, 12, '#1e1e24'); px(g, fx + 24, fy + 1, 1, 14, '#1e1e24');
    }
  }
  // ground floor
  const gy = GROUND_Y;
  const kind = b.kind || 'plain';
  if (kind === 'apartment') {
    // door with steps and transom, house number
    const dx = b.door, dw = 22;
    px(g, dx - 8, gy - 50, dw + 16, 50, shade(b.color, -18));
    px(g, dx - 2, gy - 46, dw + 4, 46, '#1a1418');
    px(g, dx, gy - 44, dw, 44, '#4a2e22'); px(g, dx + 1, gy - 43, dw - 2, 12, '#2a3a4a'); px(g, dx + 2, gy - 42, 8, 10, '#3a4a5c');
    px(g, dx + dw / 2, gy - 44, 1, 44, '#2a1a12'); px(g, dx + 3, gy - 24, 6, 1, '#c8a850');
    px(g, dx - 6, gy - 6, dw + 12, 6, '#6a6a72'); px(g, dx - 4, gy - 3, dw + 8, 3, '#7a7a82'); px(g, dx - 6, gy - 6, dw + 12, 1, '#8a8a92');
    px(g, dx - 3, gy - 58, dw + 6, 8, '#3a3a42'); drawText(g, b.num || '412', dx + dw / 2, gy - 57, '#d8d0b8', { align: 'center' });
    lights.push({ x: dx + 1, y: gy - 43, w: dw - 2, h: 12, lit: true, warm: true, door: true });
    signs.push({ x: dx - 6, y: gy - 60, w: dw + 12, text: b.name, color: '#c8c0a8' });
  }
  if (kind === 'store') {
    const sx = b.x + 10, sw = b.w - 20;
    px(g, sx - 4, gy - 50, sw + 8, 50, '#2a3a2a');
    // big window
    px(g, sx, gy - 44, sw, 40, '#1a2430');
    px(g, sx + 1, gy - 43, sw - 2, 38, '#26303c'); px(g, sx + 2, gy - 42, Math.floor(sw * 0.4), 18, '#303c4a');
    // shelves visible inside
    for (let i = 0; i < 3; i++) { px(g, sx + 6, gy - 36 + i * 10, sw - 12, 1, '#5a4a3a'); for (let j = 0; j < (sw - 16) / 7; j++) px(g, sx + 8 + j * 7, gy - 41 + i * 10, 4, 5, ['#8a3a3a', '#3a6a8a', '#c8a84a', '#4a8a4a'][(i + j) % 4]); }
    // door in window
    const dx = b.door; px(g, dx - 1, gy - 44, 24, 44, '#2a3a2a'); px(g, dx, gy - 42, 22, 42, '#26303c'); px(g, dx + 10, gy - 42, 1, 42, '#2a3a2a'); px(g, dx + 6, gy - 24, 3, 1, '#c8a850');
    lights.push({ x: sx + 1, y: gy - 43, w: sw - 2, h: 38, lit: true, warm: false, store: true });
    // awning
    const aw = sw + 8, ax = sx - 4, ay = gy - 58;
    for (let i = 0; i < aw; i += 8) px(g, ax + i, ay, Math.min(8, aw - i), 10, (i / 8) % 2 ? '#2e6a3a' : '#e8e4d8');
    px(g, ax, ay + 10, aw, 2, '#1e4a2a'); px(g, ax, ay - 1, aw, 1, '#3a7a4a');
    for (let i = 0; i < aw; i += 8) px(g, ax + i + ((i / 8) % 2 ? 0 : 0), ay + 12, 8, 1, (i / 8) % 2 ? '#1e4a2a' : '#c8c4b8');
    px(g, ax, ay - 18, aw, 16, '#1e2a1e'); px(g, ax + 1, ay - 17, aw - 2, 14, '#2a3a2a');
    // lit sign box (text is drawn as emissive neon at render time)
    px(g, ax + 2, ay - 16, aw - 4, 12, '#243424'); px(g, ax + 2, ay - 16, aw - 4, 1, '#3a5a3a');
    signs.push({ x: ax, y: ay - 16, w: aw, neon: '#f0dc8a', text: b.name });
  }
  if (kind === 'diner') {
    const sx = b.x + 8, sw = b.w - 16;
    px(g, sx - 4, gy - 52, sw + 8, 52, '#8a2a2a');
    px(g, sx - 4, gy - 52, sw + 8, 4, '#c8c8d0'); px(g, sx - 4, gy - 4, sw + 8, 4, '#c8c8d0');
    // chrome trim stripes
    for (let i = 0; i < sw + 8; i += 2) px(g, sx - 4 + i, gy - 48, 1, 44, 'rgba(255,255,255,0.05)');
    // windows
    const wn = Math.floor(sw / 44);
    for (let i = 0; i < wn; i++) {
      const wx = sx + 4 + i * 44; if (wx + 36 > b.door - 2 && wx < b.door + 26) continue;
      px(g, wx - 1, gy - 45, 38, 34, '#c8c8d0'); px(g, wx, gy - 44, 36, 32, '#3a2a34'); px(g, wx + 1, gy - 43, 34, 30, '#4a3438');
      // booths inside
      px(g, wx + 2, gy - 26, 8, 12, '#8a2a2a'); px(g, wx + 26, gy - 26, 8, 12, '#8a2a2a'); px(g, wx + 10, gy - 20, 16, 2, '#d8d0c0');
      px(g, wx + 4, gy - 40, 28, 1, '#6a5a5a');
      lights.push({ x: wx, y: gy - 44, w: 36, h: 32, lit: true, warm: true, diner: true });
    }
    // door
    const dx = b.door; px(g, dx - 2, gy - 46, 28, 46, '#c8c8d0'); px(g, dx, gy - 44, 24, 44, '#3a2a34'); px(g, dx + 2, gy - 42, 20, 26, '#4a3438'); px(g, dx + 16, gy - 24, 3, 1, '#c8a850');
    // neon sign on top
    const nx = b.x + b.w / 2, ny = gy - 74;
    px(g, nx - 50, ny - 4, 100, 22, '#1a1418'); px(g, nx - 48, ny - 2, 96, 18, '#2a2028');
    signs.push({ x: nx - 48, y: ny - 2, w: 96, neon: '#ff5a7a', text: b.name, big: true, flicker: b.brokenSign });
  }
  if (kind === 'clinic') {
    const sx = b.x + 10, sw = b.w - 20;
    px(g, sx - 4, gy - 48, sw + 8, 48, '#3a4a5a');
    px(g, sx, gy - 42, Math.floor(sw / 2) - 20, 36, '#26303c'); px(g, sx + 1, gy - 41, Math.floor(sw / 2) - 22, 34, '#2e3a48');
    px(g, sx + Math.floor(sw / 2) + 20, gy - 42, Math.floor(sw / 2) - 20, 36, '#26303c'); px(g, sx + Math.floor(sw / 2) + 21, gy - 41, Math.floor(sw / 2) - 22, 34, '#2e3a48');
    lights.push({ x: sx + 1, y: gy - 41, w: Math.floor(sw / 2) - 22, h: 34, lit: true, warm: false });
    lights.push({ x: sx + Math.floor(sw / 2) + 21, y: gy - 41, w: Math.floor(sw / 2) - 22, h: 34, lit: true, warm: false });
    const dx = b.door; px(g, dx - 2, gy - 44, 30, 44, '#c8ccd4'); px(g, dx, gy - 42, 26, 42, '#3a4a5a'); px(g, dx + 2, gy - 40, 22, 30, '#8ab0c8'); px(g, dx + 13, gy - 40, 1, 40, '#c8ccd4');
    // cross sign
    px(g, dx + 4, gy - 62, 18, 14, '#f0f0f4'); px(g, dx + 11, gy - 60, 4, 10, '#c83a3a'); px(g, dx + 8, gy - 57, 10, 4, '#c83a3a');
    signs.push({ x: dx - 30, y: gy - 74, w: 90, text: b.name, color: '#d8e0e8' });
    px(g, dx - 32, gy - 76, 94, 12, '#2a3440'); drawText(g, b.name, dx + 15, gy - 74, '#d8e0e8', { align: 'center' });
  }
  if (kind === 'warehouse') {
    // roll-up doors
    for (let i = 0; i < 3; i++) {
      const dx = b.x + 30 + i * 110;
      px(g, dx - 3, gy - 58, 66, 58, '#2a2a30'); px(g, dx, gy - 54, 60, 54, i === 1 ? '#1a1a20' : '#4a4e58');
      if (i !== 1) for (let y = 0; y < 54; y += 4) px(g, dx, gy - 54 + y, 60, 1, '#3a3e48');
      else { px(g, dx + 2, gy - 52, 56, 50, '#141418'); for (let k = 0; k < 4; k++) g.drawImage(SPR.crate, dx + 6 + k * 13, gy - 12 - (k % 2) * 12); lights.push({ x: dx + 2, y: gy - 52, w: 56, h: 50, lit: true, warm: true, dock: true }); }
      px(g, dx - 3, gy - 60, 66, 3, '#e8a020');
    }
    signs.push({ x: b.x + b.w / 2 - 60, y: GROUND_Y - b.h + 8, w: 120, text: b.name, color: '#c8c0a8' });
    px(g, b.x + b.w / 2 - 62, GROUND_Y - b.h + 6, 124, 12, '#3a3a44'); drawText(g, b.name, b.x + b.w / 2, GROUND_Y - b.h + 8, '#d0c8b0', { align: 'center' });
  }
  if (kind === 'laundry') {
    const sx = b.x + 10, sw = b.w - 20;
    px(g, sx - 4, gy - 48, sw + 8, 48, '#4a5a6a');
    px(g, sx, gy - 42, sw, 36, '#26303c'); px(g, sx + 1, gy - 41, sw - 2, 34, '#2e3a48');
    for (let i = 0; i < sw / 22 - 1; i++) { px(g, sx + 6 + i * 22, gy - 30, 16, 20, '#c8ccd0'); px(g, sx + 9 + i * 22, gy - 26, 10, 10, '#2a3a4a'); px(g, sx + 11 + i * 22, gy - 24, 6, 6, '#4a6a8a'); }
    lights.push({ x: sx + 1, y: gy - 41, w: sw - 2, h: 34, lit: true, warm: false, cool: true });
    px(g, sx - 4, gy - 62, sw + 8, 12, '#2a3a4a');
    signs.push({ x: sx - 4, y: gy - 62, w: sw + 8, neon: '#8ad8f0', text: b.name });
  }
  if (kind === 'pawn') {
    const dx = b.door;
    // window full of other people's things, with a grille
    px(g, b.x + 6, gy - 46, 30, 42, '#1a1418'); px(g, b.x + 8, gy - 44, 26, 38, '#26303c');
    px(g, b.x + 10, gy - 26, 22, 1, '#5a4a3a'); px(g, b.x + 10, gy - 14, 22, 1, '#5a4a3a');
    px(g, b.x + 11, gy - 34, 8, 8, '#8a6a3a'); px(g, b.x + 21, gy - 32, 6, 6, '#c8a850'); px(g, b.x + 12, gy - 24, 5, 9, '#3a3a40'); px(g, b.x + 20, gy - 22, 9, 7, '#8a3a3a'); px(g, b.x + 24, gy - 12, 6, 10, '#a8845a');
    for (let x = b.x + 8; x < b.x + 34; x += 4) px(g, x, gy - 44, 1, 38, 'rgba(120,110,90,0.45)'); for (let y = gy - 44; y < gy - 6; y += 6) px(g, b.x + 8, y, 26, 1, 'rgba(120,110,90,0.45)');
    px(g, dx - 2, gy - 46, 26, 46, '#1a1418'); px(g, dx, gy - 44, 22, 44, '#3a2a24'); px(g, dx + 2, gy - 42, 18, 20, '#26303c'); px(g, dx + 15, gy - 24, 3, 2, '#c8a850');
    px(g, dx + 4, gy - 40, 14, 6, '#1a1418'); drawText(g, 'OPEN', dx + 11, gy - 39, '#e8a840', { align: 'center' });
    // three brass balls + sign
    for (let i = 0; i < 3; i++) px(g, dx - 14 + i * 8, gy - 62 + (i === 1 ? 4 : 0), 5, 5, '#c8a850');
    px(g, b.x + 4, gy - 76, b.w - 8, 12, '#2a2024'); px(g, b.x + 4, gy - 76, b.w - 8, 1, '#4a3a34');
    signs.push({ x: b.x + 4, y: gy - 76, w: b.w - 8, neon: '#e8a840', text: b.name });
    lights.push({ x: b.x + 8, y: gy - 44, w: 26, h: 38, lit: true, warm: true, store: true });
    lights.push({ x: dx + 2, y: gy - 42, w: 18, h: 20, lit: true, warm: true, door: true });
  }
  if (kind === 'plain' || kind === 'pawn') {
    if (b.graffiti) { drawText(g, b.graffiti, b.x + 20, gy - 30, '#b04a8a'); px(g, b.x + 18, gy - 32, textWidth(b.graffiti) + 4, 1, '#b04a8a'); }
    if (b.poster) { px(g, b.x + b.w - 42, gy - 52, 26, 32, '#d8d0b8'); px(g, b.x + b.w - 40, gy - 50, 22, 8, '#c83a3a'); drawText(g, 'LOST', b.x + b.w - 29, gy - 49, '#f0e8e0', { align: 'center' }); px(g, b.x + b.w - 36, gy - 40, 14, 12, '#8a8a92'); px(g, b.x + b.w - 33, gy - 38, 8, 8, '#d8b090'); px(g, b.x + b.w - 38, gy - 26, 18, 1, '#2a2a2a'); px(g, b.x + b.w - 38, gy - 23, 12, 1, '#2a2a2a'); }
  }
  // grime at base
  px(g, b.x, gy - 6, b.w, 6, 'rgba(0,0,0,0.18)');
}

// ---------- static street layer ----------
const World = { static: null, lights: [], signs: [], gaps: [] };
function buildStreetStatic() {
  const [c, g] = mkCanvas(STREET.w, H);
  World.lights = []; World.signs = [];
  // fill transparent; sky drawn dynamically
  // far river end: railing, water drawn dynamically. Wall bg for 2140+ none.
  // buildings
  for (const b of STREET.buildings) paintBuilding(g, b, World.lights, World.signs);
  // gaps between buildings (for light rays & alleys)
  World.gaps = [];
  const bs = STREET.buildings;
  for (let i = 0; i < bs.length - 1; i++) {
    const a = bs[i], b = bs[i + 1];
    if (b.x - (a.x + a.w) > 20) World.gaps.push({ x0: a.x + a.w, x1: b.x, top: GROUND_Y - Math.min(a.h, b.h) });
  }
  World.gaps.push({ x0: 2140, x1: 2460, top: 40 });
  // alley backs (dark walls inside gaps)
  for (const gp of World.gaps) {
    if (gp.x0 >= 2140) continue;

// interiors: same-scale cutaway rooms. 1px = 4.5cm. Character = 38px (1.7m).
// Wall base (back wall meets floor) at GROUND_Y=206; characters stand at FEET_Y=221;
// things behind a counter stand at y=212. Floor visible 206..270. Ceiling at CEIL_Y.

const CEIL_Y = 133;              // 3.3m ceiling
const COUNTER_TOP = 194;         // 0.8m counter: top surface 194..200, front face 200..214
const COUNTER_BASE = 214;

// ---- furniture painters (x = left edge, base = y where it meets the floor) ----
function fDoor(g, x, base, col, opts) {
  opts = opts || {}; const h = 44, w = 20; const y = base - h;
  px(g, x - 2, y - 2, w + 4, h + 2, opts.frame || '#1a1418');
  px(g, x, y, w, h, col); px(g, x, y, 1, h, shade(col, 22)); px(g, x + w - 1, y, 1, h, shade(col, -30));
  if (opts.glass) { px(g, x + 3, y + 4, w - 6, 16, '#26303c'); px(g, x + 4, y + 5, 5, 6, '#3a4a5c'); }
  else { px(g, x + 3, y + 4, w - 6, 14, shade(col, -14)); px(g, x + 3, y + 22, w - 6, 16, shade(col, -14)); }
  px(g, x + w - 5, y + 24, 3, 2, '#c8a850');
}
function fWindow(g, x, y, w, h, frame) {
  px(g, x - 2, y - 2, w + 4, h + 4, frame || '#3a3a44'); px(g, x, y, w, h, '#1a2030');
  px(g, x + Math.floor(w / 2), y, 1, h, frame || '#3a3a44'); px(g, x, y + Math.floor(h / 2), w, 1, frame || '#3a3a44');
  px(g, x - 4, y + h + 2, w + 8, 2, shade(frame || '#3a3a44', 30));
}
// counter running along the back wall between x0..x1; NPCs stand behind at y=212
function fCounter(g, x0, x1, topCol, frontCol, opts) {
  opts = opts || {};
  px(g, x0, COUNTER_TOP, x1 - x0, 6, topCol); px(g, x0, COUNTER_TOP, x1 - x0, 1, shade(topCol, 30));
  px(g, x0, COUNTER_TOP + 6, x1 - x0, COUNTER_BASE - COUNTER_TOP - 6, frontCol);
  px(g, x0, COUNTER_TOP + 6, x1 - x0, 1, shade(frontCol, 20)); px(g, x0, COUNTER_BASE - 1, x1 - x0, 1, shade(frontCol, -30));
  if (opts.panels) for (let x = x0 + 6; x < x1 - 6; x += 22) px(g, x, COUNTER_TOP + 9, 14, 8, shade(frontCol, -12));
  if (opts.chrome) { px(g, x0, COUNTER_TOP + 6, x1 - x0, 2, '#d8d8e0'); px(g, x0, COUNTER_BASE - 3, x1 - x0, 2, '#d8d8e0'); }
  px(g, x0, COUNTER_BASE, x1 - x0, 2, 'rgba(0,0,0,0.35)');
}
function fShelf(g, x, base, w, h, cols, seed) {
  const R = seeded(seed || x);
  px(g, x, base - h, w, h, '#5a4636'); px(g, x, base - h, 1, h, '#7a6650'); px(g, x + w - 1, base - h, 1, h, '#3a2a1e');
  const rows = Math.floor(h / 12);
  for (let r = 0; r < rows; r++) {
    const sy = base - h + 3 + r * 12; px(g, x + 1, sy + 9, w - 2, 2, '#3a2a1e');
    for (let ix = x + 2; ix < x + w - 4; ix += 4) { if (R() < 0.15) continue; px(g, ix, sy, 3, 9, cols[Math.floor(R() * cols.length)]); px(g, ix, sy, 3, 1, 'rgba(255,255,255,0.3)'); }
  }
  px(g, x, base, w, 2, 'rgba(0,0,0,0.35)');
}
function fFridge(g, x, base, w, h) {
  px(g, x, base - h, w, h, '#c8ccd0'); px(g, x + 1, base - h + 1, w - 2, h - 2, '#2a3a44');
  const rows = Math.floor((h - 6) / 12);
  for (let r = 0; r < rows; r++) { const sy = base - h + 4 + r * 12; px(g, x + 2, sy + 9, w - 4, 1, '#8ab0c0'); for (let ix = x + 3; ix < x + w - 4; ix += 4) px(g, ix, sy, 3, 8, ['#e8e8f0', '#e8b84a', '#d84a4a', '#4a8ad8', '#8a4a9a'][(ix + r) % 5]); }
  px(g, x + 1, base - h + 1, w - 2, 1, '#e8f0ff'); px(g, x + w - 3, base - h + 8, 1, h - 16, '#e8ecf0');
  px(g, x, base, w, 2, 'rgba(0,0,0,0.35)');
}
function fTable(g, x, base, w, col) { const h = 17; px(g, x, base - h, w, 3, col); px(g, x, base - h, w, 1, shade(col, 25)); px(g, x + 2, base - h + 3, 2, h - 3, shade(col, -20)); px(g, x + w - 4, base - h + 3, 2, h - 3, shade(col, -20)); }
function fChair(g, x, base, col, dir) { const seat = 10, back = 20; px(g, x, base - seat, 10, 2, col); px(g, x + 1, base - seat + 2, 1, seat - 2, shade(col, -20)); px(g, x + 8, base - seat + 2, 1, seat - 2, shade(col, -20)); if (dir > 0) { px(g, x, base - back, 2, back - seat, col); px(g, x, base - back, 10, 1, col); } else { px(g, x + 8, base - back, 2, back - seat, col); px(g, x, base - back, 10, 1, col); } }
function fStool(g, x, base) { px(g, x, base - 17, 10, 3, '#c83a3a'); px(g, x, base - 17, 10, 1, '#e86a6a'); px(g, x + 4, base - 14, 2, 14, '#8a8a92'); px(g, x + 1, base - 1, 8, 1, '#6a6a72'); }
function fBed(g, x, base, w, headRight) {
  // frame 2m long; mattress top 0.5m; headboard 0.9m

// ---- room shell ----
function paintRoom(g, I, wallCol, floorCol, floorLine) {
  // building mass everywhere
  px(g, 0, 0, 480, 270, '#0d0d12');
  paintBrick(g, 0, 0, 480, 270, '#2a2226', 77); px(g, 0, 0, 480, 270, 'rgba(6,6,10,0.55)');
  const ceil = I.ceil || CEIL_Y;
  const FLOOR_END = 252;
  // room walls
  px(g, I.x0, ceil, I.x1 - I.x0, GROUND_Y - ceil, wallCol);
  // floor (perspective): from wall base to the front cut edge
  const fl = g.createLinearGradient(0, GROUND_Y, 0, FLOOR_END); fl.addColorStop(0, floorCol); fl.addColorStop(1, shade(floorCol, -30));
  g.fillStyle = fl; g.fillRect(I.x0, GROUND_Y, I.x1 - I.x0, FLOOR_END - GROUND_Y);
  if (floorLine) { g.save(); g.beginPath(); g.rect(I.x0, GROUND_Y, I.x1 - I.x0, FLOOR_END - GROUND_Y); g.clip(); floorLine(g); g.restore(); }
  // floor slab (cut edge) and foundation below
  px(g, I.x0 - 4, FLOOR_END, I.x1 - I.x0 + 8, 7, '#1e1e26'); px(g, I.x0 - 4, FLOOR_END, I.x1 - I.x0 + 8, 1, '#3a3a44');
  px(g, I.x0 - 4, FLOOR_END + 7, I.x1 - I.x0 + 8, 270 - FLOOR_END - 7, 'rgba(0,0,0,0.35)');
  // baseboard
  px(g, I.x0, GROUND_Y - 4, I.x1 - I.x0, 4, shade(wallCol, -30)); px(g, I.x0, GROUND_Y - 4, I.x1 - I.x0, 1, shade(wallCol, -10));
  // cornice + ceiling slab
  px(g, I.x0, ceil, I.x1 - I.x0, 2, shade(wallCol, 18));
  px(g, I.x0 - 4, ceil - 8, I.x1 - I.x0 + 8, 8, '#1e1e26'); px(g, I.x0 - 4, ceil - 8, I.x1 - I.x0 + 8, 1, '#34343e');
  // side walls (cut)
  px(g, I.x0 - 4, ceil - 8, 4, 260 - ceil + 8, '#1e1e26'); px(g, I.x1, ceil - 8, 4, 260 - ceil + 8, '#1e1e26');
  px(g, I.x0 - 1, ceil, 1, GROUND_Y - ceil, shade(wallCol, -40)); px(g, I.x1, ceil, 1, GROUND_Y - ceil, shade(wallCol, -40));
}

// ============================================================
// render: sky, parallax, shadows, puddles, rain, lighting, rays
// ============================================================
const [lightCanvas, lg] = mkCanvas(W, H);
const [tmpCanvas, tg] = mkCanvas(W, H);

// time-of-day palette
const TOD_KEYS = [
  { t: 0.0, top: [66, 74, 108], bot: [154, 140, 140], amb: [212, 202, 210], sun: 1.0 },
  { t: 0.25, top: [98, 114, 144], bot: [166, 172, 184], amb: [240, 240, 244], sun: 1.0 },
  { t: 0.55, top: [84, 100, 126], bot: [148, 156, 170], amb: [226, 226, 236], sun: 0.8 },
  { t: 0.78, top: [52, 42, 78], bot: [168, 106, 88], amb: [200, 160, 160], sun: 0.6 },
  { t: 0.9, top: [18, 20, 40], bot: [46, 42, 70], amb: [95, 92, 130], sun: 0.1 },
  { t: 1.0, top: [8, 10, 24], bot: [24, 28, 50], amb: [52, 58, 100], sun: 0.0 },
];
function todPalette(tod, rain) {
  let a = TOD_KEYS[0], b = TOD_KEYS[1];
  for (let i = 0; i < TOD_KEYS.length - 1; i++) if (tod >= TOD_KEYS[i].t && tod <= TOD_KEYS[i + 1].t) { a = TOD_KEYS[i]; b = TOD_KEYS[i + 1]; }
  const t = smooth(clamp((tod - a.t) / (b.t - a.t), 0, 1));
  let top = mixRgb(a.top, b.top, t), bot = mixRgb(a.bot, b.bot, t), amb = mixRgb(a.amb, b.amb, t);
  const sun = lerp(a.sun, b.sun, t);
  // rain desaturates + darkens
  const grey = v => { const m = (v[0] + v[1] + v[2]) / 3; return [lerp(v[0], m, 0.5) * 0.85, lerp(v[1], m, 0.5) * 0.85, lerp(v[2], m, 0.4) * 0.9]; };
  const r = rain * 0.8;
  top = mixRgb(top, grey(top), r); bot = mixRgb(bot, grey(bot), r); amb = mixRgb(amb, grey(amb), r * 0.6);
  const night = clamp((tod - 0.72) / 0.22, 0, 1);
  return { top, bot, amb, sun: sun * (1 - rain * 0.7), night };
}
function sunShadow(tod) {
  // returns {skew, scaleY, alpha}
  const d = clamp(tod / 0.82, 0, 1);
  const skew = Math.cos(d * Math.PI) * 1.9;           // +1.9 at dawn (sun right) → -1.9 at dusk
  const el = Math.sin(d * Math.PI);                   // elevation 0..1
  return { skew, scaleY: lerp(0.5, 0.2, el), alpha: lerp(0.25, 0.42, el) };
}

// ---------- sky ----------

    g.fillStyle = rgbStr(...mixRgb(pal.bot, [255, 255, 255], 0.15));
    g.fillRect(cx, cy, 120 + i * 20, 8); g.fillRect(cx + 20, cy - 4, 60 + i * 10, 4); g.fillRect(cx - 10, cy + 8, 90, 3);

    g.fillStyle = rgbStr(...pal.top); g.beginPath(); g.arc(mx - 3, my - 2, 6, 0, Math.PI * 2); g.fill();

// ---------- entity sprite fetch ----------
function entFrame(e) {

  const fr = charFrames(SPECS[e.spec]);
  const L = e.dir < 0;
  let img, sil;
  if (e.sit) { img = L ? fr.sitL : fr.sit; sil = L ? fr.silSitL : fr.silSit; }
  else if (e.walk) { const f = e.frame | 0; img = L ? fr.walkL[f] : fr.walk[f]; sil = L ? fr.silWalkL[f] : fr.silWalk[f]; }
  else { img = L ? fr.idleL : fr.idle; sil = L ? fr.silL : fr.sil; }
  return { img, sil, w: HUMAN_W, h: HUMAN_H, cx: 12 };
}
const silCache = {};
function spriteSil(key) { if (!silCache[key]) silCache[key] = silhouette(SPR[key], '#000'); return silCache[key]; }

function drawShadow(g, e, fr, sx, sy, shadow, lampsOnScreen) {
  const sil = fr.sil || (e.sprite ? spriteSil(e.sprite) : null); if (!sil) return;
  const list = [];
  if (shadow.alpha > 0.02) list.push({ skew: shadow.skew, scaleY: shadow.scaleY, alpha: shadow.alpha });
  for (const L of lampsOnScreen) {
    const d = sx - L.x; const dist = Math.abs(d); if (dist > 110) continue;
    const a = L.alpha * (1 - dist / 110) * 0.55; if (a < 0.02) continue;
    list.push({ skew: clamp(d / 45, -2.2, 2.2), scaleY: 0.32, alpha: a });
  }
  for (const s of list) {
    g.save(); g.globalAlpha = s.alpha;
    g.setTransform(1, 0, s.skew, s.scaleY, sx, sy);
    g.drawImage(sil, -fr.cx, -fr.h + (e.sprite ? 0 : 2));
    g.restore();
  }
  // contact shadow
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(sx - fr.cx + 2, sy - 1, fr.w - 4, 2);
}

// ---------- lights list for a frame ----------
function collectLamps(camX, pal) {

  const night = pal.night; if (night <= 0.02) return out;

  return out;
}

// ---------- main street render ----------
function renderStreet(g, t) {
  const camX = G.camX; const pal = todPalette(G.tod, G.rain); G.pal = pal;
  drawSky(g, pal, camX, t);

  if (night > 0.02) {
    for (const L of World.lights) {

      if (!L.lit && !L.door) continue;

      if (L.flicker) a *= 0.6 + 0.4 * Math.abs(Math.sin(t * 0.02 + L.x));

    }
  }

  for (const e of ents) {

function drawBubble(g, e, sx, t) {

function drawPuddles(g, ents, camX, pal, t) {
  for (const p of STREET.puddles) {
    const [wx, wy, rw, rh] = p; const sx = wx - camX; if (sx + rw < 0 || sx - rw > W) continue;

// ---------- rain ----------
const rainDrops = []; const splashes = [];
function initRain() { rainDrops.length = 0; for (let i = 0; i < 260; i++) rainDrops.push({ x: Math.random() * (W + 80), y: Math.random() * H, v: 6 + Math.random() * 4, l: 5 + Math.random() * 6, z: Math.random() }); }
initRain();
let rainCamX = null;
function updateRain(camX) {
  const n = Math.floor(rainDrops.length * G.rain);
  const dx = -1.4 - G.wind;
  // the rain hangs in the world, not on the camera: when the view scrolls, the drops slide the other way
  const shift = rainCamX === null || Math.abs(camX - rainCamX) > W ? 0 : camX - rainCamX; rainCamX = camX;
  for (let i = 0; i < n; i++) {
    const d = rainDrops[i]; d.x += dx * (0.6 + d.z * 0.6) - shift * (0.5 + d.z * 0.5); d.y += d.v * (0.6 + d.z * 0.6);
    if (d.x > W + 60) d.x -= W + 80; else if (d.x < -40 && shift < 0) d.x += W + 80;
    if (d.y > H || d.x < -20) {
      if (d.y > H && Math.random() < 0.5) splashes.push({ x: d.x, y: G.scene === 'street' ? (GROUND_Y + 2 + Math.random() * (H - GROUND_Y - 4)) : H - 10, t: 0 });
      d.y = -10 - Math.random() * 40; d.x = Math.random() * (W + 80);
    }
  }
  for (let i = splashes.length - 1; i >= 0; i--) { splashes[i].t++; splashes[i].x -= shift; if (splashes[i].t > 8) splashes.splice(i, 1); }
  if (splashes.length > 90) splashes.splice(0, splashes.length - 90);
}
function drawRain(g, t, camX, clipRect) {
  if (G.rain <= 0.01) return;
  const n = Math.floor(rainDrops.length * G.rain);
  g.save(); if (clipRect) { g.beginPath(); g.rect(...clipRect); g.clip(); }
  g.strokeStyle = 'rgba(190,205,230,0.5)'; g.lineWidth = 1;
  g.beginPath();
  for (let i = 0; i < n; i++) { const d = rainDrops[i]; const dx = (-1.4 - G.wind) * (0.6 + d.z * 0.6); g.moveTo(d.x, d.y); g.lineTo(d.x + dx * d.l / 6, d.y + d.l * (0.6 + d.z * 0.6)); }

}

// ---------- lighting overlay ----------
function buildLighting(pal, camX, lamps, t) {
  lg.globalCompositeOperation = 'source-over';
  lg.fillStyle = rgbStr(...pal.amb); lg.fillRect(0, 0, W, H);
  lg.globalCompositeOperation = 'lighter';
  const night = pal.night;

    const rg = lg.createRadialGradient(L.x, L.y, 4, L.x, L.y, L.r);
    rg.addColorStop(0, `rgba(${L.color[0]},${L.color[1]},${L.color[2]},${0.95 * L.alpha})`);
    rg.addColorStop(0.35, `rgba(${L.color[0]},${L.color[1]},${L.color[2]},${0.5 * L.alpha})`);
    rg.addColorStop(1, 'rgba(0,0,0,0)');

    pg.addColorStop(0, `rgba(${L.color[0]},${L.color[1]},${L.color[2]},${0.5 * L.alpha})`); pg.addColorStop(1, 'rgba(0,0,0,0)');
    lg.fillStyle = pg; lg.save(); lg.scale(1, 0.45); lg.fillRect(L.x - 80, (GROUND_Y + 8) / 0.45 - 80, 160, 160); lg.restore();
  }

    // window spill

      if (!L.lit) continue; const sx = L.x - camX; if (sx + L.w < -40 || sx > W + 40) continue;
      if (L.diner && G.flags.dinerClosed) continue;
      const cx = sx + L.w / 2, cy = L.y + L.h / 2; const r = Math.max(L.w, L.h) * (L.store || L.diner || L.dock ? 1.6 : 1.1);
      const col = L.cool ? [150, 210, 255] : L.warm ? [255, 200, 130] : [220, 225, 255];
      const rg = lg.createRadialGradient(cx, cy, 2, cx, cy, r); rg.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${0.45 * night})`); rg.addColorStop(1, 'rgba(0,0,0,0)');

// ---------- glows (additive halos + volumetric cones) ----------

  g.globalCompositeOperation = 'lighter';
  const night = pal.night;
  for (const L of lamps) {
    // bulb halo
    const rg = g.createRadialGradient(L.x, L.y, 1, L.x, L.y, 26 + G.rain * 12);
    rg.addColorStop(0, `rgba(255,230,180,${0.5 * L.alpha})`); rg.addColorStop(0.3, `rgba(255,210,150,${0.18 * L.alpha})`); rg.addColorStop(1, 'rgba(255,200,140,0)');

    // volumetric cone

    cg.addColorStop(0, `rgba(255,214,150,${(0.16 + G.rain * 0.1) * L.alpha})`); cg.addColorStop(1, 'rgba(255,214,150,0)');

// ---------- god rays through the gaps ----------
function drawRays(g, pal, camX, t, shadow, gaps) {
  gaps = gaps || World.gaps;
  const strength = pal.sun * (1 - pal.night) * (1 - G.rain * 0.8) * (0.9 - Math.abs(G.tod - 0.15) * 1.6);
  if (strength <= 0.02) return;
  g.globalCompositeOperation = 'lighter';
  const TOP = -12, BOT = GROUND_Y + 30;
  for (const gp of gaps) {
    const x0 = gp.x0 - camX, x1 = gp.x1 - camX; if (x1 < -400 || x0 > W + 400) continue;
    // the beam is a straight shaft of light from the top edge of the screen to the ground, aimed so it passes through the gap
    const slope = -shadow.skew * 0.55;                       // horizontal drift per vertical pixel
    const H = BOT - TOP; const off = slope * H;              // total drift top→bottom
    const upDrift = slope * (gp.top - TOP);                  // how far the shaft has drifted by the time it reaches the gap
    const pulse = 0.85 + 0.15 * Math.sin(t * 0.01 + gp.x0);
    const nb = Math.max(2, Math.floor((x1 - x0) / 14));
    for (let i = 0; i < nb; i++) {
      const gx0 = x0 + (i / nb) * (x1 - x0), bw = (x1 - x0) / nb * 0.7;
      const tx0 = gx0 - upDrift;                             // where this shaft crosses the top edge
      const a = (0.10 + 0.08 * Math.sin(t * 0.013 + i * 1.7 + gp.x0)) * strength * pulse;
      const lg2 = g.createLinearGradient(0, TOP, 0, BOT);
      lg2.addColorStop(0, `rgba(255,236,200,${a * 0.55})`); lg2.addColorStop(0.35, `rgba(255,236,200,${a})`); lg2.addColorStop(0.8, `rgba(255,230,190,${a * 0.3})`); lg2.addColorStop(1, 'rgba(255,230,190,0)');
      g.fillStyle = lg2; g.beginPath(); g.moveTo(tx0, TOP); g.lineTo(tx0 + bw, TOP); g.lineTo(tx0 + bw + off, BOT); g.lineTo(tx0 + off, BOT); g.closePath(); g.fill();
    }
    // dust motes along the shaft
    g.fillStyle = `rgba(255,240,210,${0.5 * strength})`; const R = seeded(gp.x0);
    for (let i = 0; i < 18; i++) { const p = ((t * 0.15 + R() * 300) % 300) / 300; const y = TOP + p * H; const x = (x0 - upDrift) + R() * (x1 - x0) + off * p + Math.sin(t * 0.03 + i) * 3; g.fillRect(x, y, 1, 1); }
  }
  g.globalCompositeOperation = 'source-over';
}

function drawVignette(g) {
  const rg = g.createRadialGradient(W / 2, H / 2, H * 0.5, W / 2, H / 2, H * 1.05);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.36)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}

    const lg2 = g.createLinearGradient(w.x, w.y, w.x + 120, w.y + 160); lg2.addColorStop(0, `rgba(230,235,255,${a})`); lg2.addColorStop(1, 'rgba(230,235,255,0)');

// ---------- dialogue engine ----------
const Dlg = {
  steps: [], i: 0, active: false, line: null, shown: 0, choices: null, sel: 0, done: null, autoT: 0,
  run(steps, done) {

  insert(steps) { const f = []; (function fl(s) { for (const x of s) { if (Array.isArray(x)) fl(x); else if (x) f.push(x); } })(steps); this.steps.splice(this.i, 0, ...f); },
  next() {

      if (s.fn) { const r = s.fn(); if (Array.isArray(r)) this.insert(r); continue; }

      if (s.choice) { this.choices = s.choice.filter(c => !c.hide || !c.hide()); this.sel = 0; return; }
      if (s.wait) { this.line = null; this.autoT = s.wait; return; }
    }
  },
  end() { this.active = false; this.line = null; this.choices = null; if (G.state === 'dialogue') G.state = 'play'; const d = this.done; this.done = null; if (d) d(); },
  update() {
    if (this.autoT > 0) { this.autoT--; if (this.autoT === 0) this.next(); return; }
    if (this.choices) {
      if (Input.hit('up')) { this.sel = (this.sel + this.choices.length - 1) % this.choices.length; Audio.blip(); }
      if (Input.hit('down')) { this.sel = (this.sel + 1) % this.choices.length; Audio.blip(); }

      }

  },

const MG = { cur: null, onDone: null };
function startMinigame(kind, onDone) {
  MG.onDone = onDone;
  MG.cur = kind === 'dishes' ? new DishGame() : kind === 'crates' ? new CrateGame() : kind === 'data' ? new DataGame() : kind === 'cuts' ? new CutsGame() : new DeliveryGame();
  MG.cur.start(); G.state = 'minigame';
}
function endMinigame(pay, lines) {

}

// ---------- DISHES ----------
class DishGame {

  }

  draw(g, t) {

// ---------- CRATES ----------
class CrateGame {
  start() {
    this.t = 0; this.stack = [{ x: 200, w: 60 }]; this.cur = { x: 100, w: 60, dir: 1 }; this.speed = 1.6 + difficulty() * 1.2; this.falling = null; this.intro = 150; this.over = 0; this.count = 0; this.max = 12; this.pay = 0; this.debris = [];
  }
  update() {
    if (this.intro > 0) { this.intro--; if (Input.anyHit()) this.intro = 0; return; }
    if (this.over > 0) { this.over--; if (this.over === 0 || Input.hit('act')) endMinigame(this.pay, [`${this.count} crates stacked`]); return; }
    this.t++;
    if (this.falling) {
      this.falling.y += 6;
      const targetY = 200 - this.stack.length * 12;
      if (this.falling.y >= targetY) {
        const top = this.stack[this.stack.length - 1]; const f = this.falling; this.falling = null;
        const left = Math.max(top.x, f.x), right = Math.min(top.x + top.w, f.x + f.w); const w = right - left;
        if (w <= 6) { // toppled
          this.debris.push({ x: f.x, y: targetY, vx: f.x < top.x ? -2 : 2, vy: -1, r: 0 }); Audio.bad(); this.over = 150; this.pay = Math.round(this.count * 3 + (this.count >= 8 ? 6 : 0)); return;
        }
        if (f.w - w > 2) { this.debris.push({ x: f.x < top.x ? f.x : right, y: targetY, vx: f.x < top.x ? -1.5 : 1.5, vy: -1, r: 0, w: f.w - w }); Audio.tone(300, 0.08, 'square', 0.03); } else { Audio.tone(900, 0.08, 'square', 0.04); this.pay += 2; }
        this.stack.push({ x: left, w: w }); this.count++; this.pay += 3; Audio.coin();
        if (this.count >= this.max) { this.over = 150; this.pay += 12; return; }
        this.cur = { x: irnd(0, 1) ? 60 : 340, w: w, dir: irnd(0, 1) ? 1 : -1 }; this.speed += 0.18;
      }
    } else {

      if (Input.hit('act') || Input.hit('down')) { this.falling = { x: this.cur.x, w: this.cur.w, y: 60 }; Audio.tone(220, 0.1, 'triangle', 0.03, 0.7); }
    }
    for (const d of this.debris) { d.x += d.vx; d.vy += 0.4; d.y += d.vy; d.r += d.vx * 0.05; }
    this.debris = this.debris.filter(d => d.y < H + 20);
  }
  drawCrate(g, x, y, w) {
    px(g, x, y, w, 12, '#8a6a3a'); px(g, x, y, w, 1, '#a8864a'); px(g, x, y + 11, w, 1, '#5a4020'); px(g, x, y, 1, 12, '#a8864a'); px(g, x + w - 1, y, 1, 12, '#5a4020');
    for (let i = 8; i < w - 4; i += 12) px(g, x + i, y + 1, 1, 10, '#6a4a2a'); px(g, x + 2, y + 5, w - 4, 1, '#6a4a2a');
  }
  draw(g, t) {

    // rails
    px(g, 40, 50, W - 80, 4, '#3a3e48'); px(g, 40, 50, W - 80, 1, '#6a6e78');
    // floor
    px(g, 40, 200, W - 80, 30, '#4a4a50'); px(g, 40, 200, W - 80, 2, '#6a6a72'); px(g, 40, 212, W - 80, 2, '#e8a020');

    this.drawCrate(g, c.x, cy, c.w);

    for (const d of this.debris) { g.save(); g.translate(d.x, d.y); g.rotate(d.r); this.drawCrate(g, 0, 0, d.w || 60); g.restore(); }
    if (this.intro > 0) { UI.panel(g, W / 2 - 130, 224, 260, 30, 0.95); drawText(g, 'Drop the crate with E when it lines up.', W / 2, 230, '#f0ead8', { align: 'center' }); drawText(g, 'Overhang gets sliced off. Any key to start.', W / 2, 240, '#c8ccd8', { align: 'center' }); }
    else if (this.over > 0) { UI.panel(g, W / 2 - 100, 224, 200, 30, 0.95); drawText(g, this.count >= this.max ? 'Full pallet. Nice.' : 'It toppled.', W / 2, 230, '#e8c84a', { align: 'center' }); drawText(g, `${this.count} crates  -  $${this.pay}`, W / 2, 240, '#f0ead8', { align: 'center' }); }

// ---------- DELIVERY ----------
class DeliveryGame {
  start() {
    this.t = 0; this.x = 0; this.py = 0; this.vy = 0; this.speed = 2.2 + difficulty() * 1.0; this.len = 2600 + difficulty() * 1200; this.obs = []; this.pkgs = []; this.got = 0; this.hits = 0; this.intro = 150; this.over = 0; this.frame = 0; this.hurt = 0;
    let x = 300; while (x < this.len - 200) { if (Math.random() < 0.7) this.obs.push({ x, k: pick(['bin', 'puddle', 'cone', 'cart']) }); if (Math.random() < 0.7) this.pkgs.push({ x: x + 90, y: irnd(0, 1) ? 0 : 34 }); x += 150 + Math.random() * 120; }
    this.total = this.pkgs.length;
  }
  update() {
    if (this.intro > 0) { this.intro--; if (Input.anyHit()) this.intro = 0; return; }
    if (this.over > 0) { this.over--; if (this.over === 0 || Input.hit('act')) endMinigame(this.pay, [`${this.got}/${this.total} packages delivered`]); return; }
    this.t++; this.x += this.speed; this.frame = (this.frame + 0.25) % 4;
    if ((Input.hit('up') || Input.hit('act')) && this.py === 0) { this.vy = -5.2; Audio.tone(500, 0.08, 'square', 0.03, 1.4); }
    this.vy += 0.32; this.py += this.vy; if (this.py > 0) { this.py = 0; this.vy = 0; }
    if (this.hurt > 0) this.hurt--;
    const px0 = this.x + 60;
    for (const o of this.obs) { if (o.hit) continue; const ow = o.k === 'cart' ? 20 : 12; if (px0 + 5 > o.x && px0 - 5 < o.x + ow && this.py > -14) { o.hit = true; this.hits++; this.hurt = 20; Audio.bad(); this.speed = Math.max(1.6, this.speed - 0.2); } }
    for (const p of this.pkgs) { if (p.got) continue; if (Math.abs(px0 - p.x) < 10 && Math.abs(-this.py - p.y) < 22) { p.got = true; this.got++; Audio.coin(); } }
    if (this.x > this.len) { this.over = 150; this.pay = Math.max(0, Math.round(this.got * 2 - this.hits)); }
  }
  draw(g, t) {
    mgFrame(g, "DELIVERY RUN - LIN'S MARKET", `packages ${this.got}/${this.total}   bumps ${this.hits}`);
    // scrolling street strip
    const camX = this.x; const sy = 150; const gy = 200;
    g.save(); g.beginPath(); g.rect(24, 40, W - 48, 190); g.clip();
    // background: static street, tiled
    const sw = World.static.width; let off = -(camX % sw);
    g.globalAlpha = 0.9; for (let x = off - sw; x < W; x += sw) g.drawImage(World.static, x, 0); g.globalAlpha = 1;
    g.fillStyle = 'rgba(6,8,14,0.45)'; g.fillRect(0, 0, W, H);
    // obstacles & packages
    for (const o of this.obs) { const sx = o.x - camX; if (sx < -40 || sx > W) continue; if (o.k === 'bin') g.drawImage(SPR.bin, sx, FEET_Y - 12); else if (o.k === 'cart') g.drawImage(SPR.cart, sx, FEET_Y - 12); else if (o.k === 'cone') { px(g, sx + 3, FEET_Y - 10, 6, 10, '#e87a2a'); px(g, sx + 1, FEET_Y - 1, 10, 2, '#e87a2a'); px(g, sx + 4, FEET_Y - 6, 4, 2, '#f0f0f0'); } else { g.fillStyle = 'rgba(120,150,190,0.5)'; g.beginPath(); g.ellipse(sx + 6, FEET_Y, 14, 3, 0, 0, Math.PI * 2); g.fill(); } if (o.hit) { g.fillStyle = 'rgba(216,74,74,0.5)'; g.fillRect(sx, FEET_Y - 14, 12, 14); } }
    for (const p of this.pkgs) { if (p.got) continue; const sx = p.x - camX; if (sx < -20 || sx > W) continue; const by = FEET_Y - 8 - p.y + Math.sin(t * 0.1 + p.x) * 2; px(g, sx - 5, by - 5, 10, 8, '#c8a06a'); px(g, sx - 5, by - 5, 10, 1, '#e8c08a'); px(g, sx - 1, by - 5, 2, 8, '#8a6a4a'); }
    // player
    const fr = charFrames(SPECS.player); const img = this.py < 0 ? fr.walk[1] : fr.walk[Math.floor(this.frame)];
    if (this.hurt % 4 < 2) g.drawImage(img, 60 - 12, FEET_Y - 38 + this.py);
    g.restore();

// ENDING LIST
// ============================================================
function buildEndingList() {
  const out = []; const a = C('amos'), m = C('mei'), w = C('walter'), n = C('nadia'), f = G.flags;
  // Amos
  if (a.dead) out.push({ name: 'Amos', line: a.met ? 'He got sick in the cold. You knew his name, and then he was gone.' : 'You never learned his name. Somebody left flowers on the cardboard. A week later a corner of the cardboard was sticking out of the dumpster.', bad: true });
  else if (a.room) out.push({ name: 'Amos Delacroix Reed', line: 'Carpenter. Neighbor. He has a door that locks and a chair that is yours. He carved you a bird.' });
  else if (a.job) out.push({ name: 'Amos Reed', line: `Working ${a.job === 'diner' ? "at Nadia's" : 'the freight dock'}, six to two. First paycheck in three years.` });
  else if (a.id) out.push({ name: 'Amos Reed', line: 'He has a coat, an ID, and his own name on a card. He is still looking for work. He will find it.' });
  else if (a.coat) out.push({ name: 'Amos', line: 'He slept through a whole night in the coat you bought. He is still on the cardboard, but he is warm.' });
  else if (a.fed >= 2) out.push({ name: 'Amos', line: 'You fed him when no one else would. He knows your face. It is not enough, and it is not nothing.' });
  else out.push({ name: 'The man by the stoop', line: 'You walked past him every day. He is still there.', bad: true });
  // Mei
  if (m.cold) out.push({ name: 'Mei', line: 'You told her drawing was a waste. She stopped showing anyone.', bad: true });
  else if (m.accepted) out.push({ name: 'Mei Lin', line: 'Illustration program, half grant. She put your portrait in the portfolio. Her mother laughed for the first time in years.' });
  else if (m.applied) out.push({ name: 'Mei Lin', line: 'She sent the application. The letter will come after you are gone. She will read it at the counter and go quiet.' });
  else if (m.missed) out.push({ name: 'Mei', line: 'The deadline passed. She still draws when it is slow. Next year, maybe.', bad: true });
  else if (m.sketch) out.push({ name: 'Mei', line: 'She filled the sketchbook you bought her. The street, the lamp, Amos, you.' });
  else if (m.seen) out.push({ name: 'Mei', line: 'You asked to see her drawings. Nobody had before.' });
  else out.push({ name: 'The girl at the counter', line: "Bread's five. That is all you ever said to each other.", bad: true });
  // Walter
  if (w.sat >= 6) out.push({ name: 'Walter Ashby', line: `He died on day ${w.deadDay}, in his sleep, after ${w.sat} afternoons on a bench with you. He walked to the river again. ${G.inv.chess ? "His chess set is on your table." : ''}`.trim() });
  else if (w.sat >= 3) out.push({ name: 'Walter', line: `You sat with him ${w.sat} times. ${w.radio ? 'His radio works again. ' : ''}He died waiting for a bus that does not come, but not alone. Not entirely.` });
  else if (w.met) out.push({ name: 'Walter', line: 'The old man at the bus stop. You sat with him once. Then the bench was empty and you never knew why.', bad: true });
  else out.push({ name: 'The old man on the bench', line: 'He waited for the 14 every day. One day he was not there.', bad: true });
  // Nadia
  if (n.saved) out.push({ name: 'Nadia & Sam', line: `The diner made rent. The sign says NADIA'S in steady pink. There is a soup on the board called the 412.${a.job === 'diner' ? ' Amos runs the kitchen.' : ''}` });
  else if (n.closed) out.push({ name: 'Nadia', line: `The diner closed on day ${n.rentDay}. She took Sam to her sister's. ${n.trust >= 3 ? 'She hugged you at the bus stop and did not let go for a while.' : 'You did not say goodbye.'}`, bad: n.trust < 3 });
  else if (n.shifts >= 3) out.push({ name: 'Nadia', line: 'Free coffee, always. You washed a lot of her plates.' });
  else out.push({ name: 'The woman at the diner', line: 'You never learned her name.', bad: true });
  // minors
  if (f.dogFollows) out.push({ name: 'The dog', line: 'It slept at the foot of your bed every night after that. It is still there.' });
  else if (f.dogFed) out.push({ name: 'A stray dog', line: 'You fed it through the fence. It remembered you.' });
  if (G.chars.theo && G.chars.theo.reunited) { }
  else if (f.buskerTips >= 3) out.push({ name: 'The busker', line: 'He wrote a song about rain and played it for you. You were his best audience.' });
  else if (f.buskerTips) out.push({ name: 'The busker', line: 'A dollar in a guitar case. He played anyway.' });
  if (f.grannyHelped >= 3) out.push({ name: 'Mrs. Ortega', line: `Oranges in the gutter, ${f.grannyHelped} times. She brought tamales to your door at the end.` });
  else if (f.grannyHelped) out.push({ name: 'Mrs. Ortega', line: 'You picked up her oranges once. She never forgot it.' });
  if (f.kidHelped) out.push({ name: 'A lost kid', line: 'He held your sleeve all the way to the clinic. His mother mouthed thank you over his head.' });
  const nl = Nora.endingLine(); if (nl) out.splice(4, 0, nl);
  const el = Emmett.endingLine(); if (el) out.splice(5, 0, el);
  for (const x of Phone.endingLines()) out.splice(1, 0, x);
  if (f.pryorDock) out.push({ name: 'Mr. Pryor', line: 'A man on the Sunday bus with a spreadsheet he was not reading. His father held a rod on the pier for an hour and said the first word in a month.' });
  else if (f.pryorTalks >= 2) out.push({ name: 'Mr. Pryor', line: 'Forty minutes a Sunday, thirty of them on his phone. He told a stranger on a bus. That was you.' });
  if (f.ortegaStone) out.push({ name: 'Hector Ortega', line: 'Grey granite, not black. HE FIXED THINGS. Sixty tamales a week and forty-one Sundays on the 14, and you carried the cooler.' });
  const le = Ladder.endingEntry(); if (le) out.push(le);
  for (const x of Theo.endingLines()) out.splice(5, 0, x);
  return out;
}

// ---------- elevator ----------
const Elevator = {
  active: false, dir: 'down', t: 0, phase: 0, onArrive: null, floor: 4, rattle: 0,
  start(dir, onArrive, from, to) { this.active = true; this.dir = dir; this.from = from === undefined ? (dir === 'down' ? 4 : 1) : from; this.to = to === undefined ? (dir === 'down' ? 1 : 4) : to; this.t = 0; this.phase = 0; this.onArrive = onArrive; this.floor = this.from; this.prev = G.state; G.state = 'elevator'; Audio.tone(180, 0.3, 'triangle', 0.04, 0.8); },
  steps() { return Math.max(1, Math.abs(this.to - this.from)); },
  update() {
    this.t++;
    if (Input.hit('act') && this.phase < 2) { this.phase = 2; this.t = 0; this.arrive(); }
    if (this.phase === 0 && this.t > 34) { this.phase = 1; this.t = 0; }
    else if (this.phase === 1) {
      const step = Math.min(this.steps(), Math.floor(this.t / 28));
      const fl = this.from + Math.sign(this.to - this.from) * step;
      if (fl !== this.floor) { this.floor = fl; Audio.tone(520, 0.05, 'sine', 0.03); }
      if (this.t % 9 === 0) Audio.tone(70 + Math.random() * 30, 0.08, 'sawtooth', 0.015);
      if (this.t > 28 * this.steps() + 20) { this.phase = 2; this.t = 0; this.arrive(); Audio.tone(660, 0.12, 'sine', 0.04); }
    }
    else if (this.phase === 2 && this.t > 34) { this.active = false; G.state = 'play'; }
  },
  arrive() { if (this.onArrive) { const f = this.onArrive; this.onArrive = null; f(); } },
  draw(g, t) {
    const inHall = G.scene === 'hall' || G.scene === 'basement';
    const tt = this.t;

      if (inHall) { const pl = G.entities[0]; pl.x = G.scene === 'basement' ? 340 : 388; pl.dir = -1; pl.walk = false; }
      renderScene(g, t);
      if (inHall) {
        const closing = this.phase === 0; const k = Math.min(1, tt / 30); const shut = closing ? k : 1 - k;
        const dx = G.scene === 'basement' ? 324 : 372, dw = 32, top = GROUND_Y - 44; const half = Math.round(dw / 2 * shut);

        UI.drawHud(g, t);
      } else {
